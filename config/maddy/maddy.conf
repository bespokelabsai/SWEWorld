## SWEWorld — maddy configuration for a closed, offline world.
##
## Derived from maddy 0.9's stock Docker config, with four deliberate changes:
##
##   1. No inbound authentication checks (dmarc/dkim/spf/require_mx_record).
##      They all need public DNS. In a .local world every one of them either
##      rejects the message or stalls on a timeout.
##   2. No outbound delivery. target.remote / target.queue are gone entirely;
##      mail to a non-local domain is rejected immediately rather than queued
##      forever against MX records that don't resolve.
##   3. No DKIM signing on submission — nothing here is ever verified.
##   4. insecure_auth on submission and IMAP, so scripts/ingest_mail.py can
##      LOGIN over plaintext :143 without trusting a self-signed cert.
##
## Everything else (imapsql storage, pass_table credentials) is stock, so
## `maddy creds create` and `maddy imap-acct create` work as documented.

# ----------------------------------------------------------------------------
# Base variables

$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_DOMAIN}
$(local_domains) = $(primary_domain)

# Self-signed pair generated by scripts/bootstrap.sh. Maddy refuses to start
# if these are absent, even when nothing will verify them.
tls file /data/tls/fullchain.pem /data/tls/privkey.pem

# ----------------------------------------------------------------------------
# Local storage & authentication

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}

# ----------------------------------------------------------------------------
# Message routing

hostname $(hostname)

table.chain local_rewrites {
    optional_step regexp "(.+)\+(.+)@(.+)" "$1@$3"
    optional_step static {
        entry postmaster postmaster@$(primary_domain)
    }
    # optional_step: absent file is not an error. Populate /data/aliases if the
    # generated world needs distribution lists (team@, oncall@, ...).
    optional_step file /data/aliases
}

msgpipeline local_routing {
    destination postmaster $(local_domains) {
        modify {
            replace_rcpt &local_rewrites
        }
        deliver_to &local_mailboxes
    }

    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

# ----------------------------------------------------------------------------
# SMTP (MX) — accepts mail for local domains only

smtp tcp://0.0.0.0:25 {
    limits {
        all rate 50 1s
        all concurrency 20
    }

    # No dmarc/dkim/spf/require_mx_record checks: see header note 1.

    default_source {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.1.1 "Closed world: no outbound relay"
        }
    }
}

# ----------------------------------------------------------------------------
# Submission — authenticated sending from personas / Roundcube / Outline

submission tcp://0.0.0.0:587 tls://0.0.0.0:465 {
    limits {
        all rate 50 1s
    }

    # Permit AUTH on the plaintext port. Closed world, disposable credentials.
    insecure_auth yes

    auth &local_authdb

    source $(local_domains) {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.1.1 "Closed world: no outbound relay"
        }
    }
    default_source {
        reject 501 5.1.8 "Non-local sender domain"
    }
}

# ----------------------------------------------------------------------------
# IMAP — what ingest_mail.py APPENDs into, and what Roundcube reads

imap tcp://0.0.0.0:143 tls://0.0.0.0:993 {
    insecure_auth yes
    auth &local_authdb
    storage &local_mailboxes
}
