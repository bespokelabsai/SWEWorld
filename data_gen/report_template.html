<title>Curator Ground Truth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">

<style>
/* ---------------------------------------------------------------------------
   Tokens. The bare :root block is the complete light palette; the two blocks
   after it redefine only tokens, so every component styles through them and
   resolves in all three viewer states (system, explicit light, explicit dark).
   --------------------------------------------------------------------------- */
:root {
  --bg:#F5F7F7; --surface:#FFFFFF; --surface-2:#FAFBFB; --surface-3:#F0F3F4;
  --border:#E1E6E8; --border-strong:#C7D0D4;
  --ink:#121A1F; --ink-2:#4C5A62; --ink-3:#7E8D95;
  --accent:#0A8F9C; --accent-deep:#076F79; --accent-wash:#E4F3F4;
  --cat-1:#0A8F9C; --cat-2:#5B4BC4; --cat-3:#B4622A;
  --added:#14713A; --removed:#A62F27; --warn:#8A5A08; --warn-wash:#FBF1DF;
  --on-accent:#FFFFFF;
  --track:#E8ECEE; --shadow:0 1px 2px rgba(18,26,31,.06), 0 8px 24px -16px rgba(18,26,31,.18);

  --step--1:.75rem; --step-0:.875rem; --step-1:1rem; --step-2:1.25rem;
  --step-3:1.6rem; --step-4:2.1rem; --step-5:2.9rem;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --serif:"IBM Plex Serif", ui-serif, Georgia, serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius:6px; --gutter:clamp(1rem, 4vw, 2.5rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0F1417; --surface:#161D21; --surface-2:#1A2226; --surface-3:#202A2F;
    --border:#27323A; --border-strong:#3A4952;
    --ink:#E7EEF1; --ink-2:#A6B4BB; --ink-3:#74858D;
    --accent:#29A6B2; --accent-deep:#4FC3CE; --accent-wash:#122A2E;
    --cat-1:#29A6B2; --cat-2:#8B7BEA; --cat-3:#CE7F45;
    --added:#4FB672; --removed:#E4695E; --warn:#D79A3C; --warn-wash:#2A2113;
    --on-accent:#0F1417;
    --on-accent:#0F1417;
  --track:#232E34; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  --bg:#0F1417; --surface:#161D21; --surface-2:#1A2226; --surface-3:#202A2F;
  --border:#27323A; --border-strong:#3A4952;
  --ink:#E7EEF1; --ink-2:#A6B4BB; --ink-3:#74858D;
  --accent:#29A6B2; --accent-deep:#4FC3CE; --accent-wash:#122A2E;
  --cat-1:#29A6B2; --cat-2:#8B7BEA; --cat-3:#CE7F45;
  --added:#4FB672; --removed:#E4695E; --warn:#D79A3C; --warn-wash:#2A2113;
  --track:#232E34; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:var(--step-0); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4 { font-family:var(--serif); font-weight:600; text-wrap:balance; margin:0; }
a { color:var(--accent-deep); text-decoration-thickness:1px; text-underline-offset:2px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

.wrap { max-width:1200px; margin:0 auto; padding:0 var(--gutter); }
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* --- masthead ------------------------------------------------------------ */
.masthead { border-bottom:1px solid var(--border); background:var(--surface); }
.masthead-inner { display:flex; flex-wrap:wrap; gap:1.5rem 2rem; align-items:flex-end;
  justify-content:space-between; padding-top:2.4rem; padding-bottom:1.4rem; }
.title { font-size:var(--step-5); letter-spacing:-.022em; line-height:1.02; }
.subtitle { color:var(--ink-2); margin-top:.5rem; max-width:62ch; }
.provenance { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:1rem; }
.chip { font-family:var(--mono); font-size:var(--step--1); padding:.2rem .5rem;
  border:1px solid var(--border); border-radius:4px; color:var(--ink-2); background:var(--surface-2); }
.chip b { color:var(--ink); font-weight:500; }

/* --- tabs ---------------------------------------------------------------- */
.tabs { position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--border); }
.tabs-inner { display:flex; gap:.25rem; align-items:stretch; }
.tab { appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  padding:.85rem .1rem; margin-right:1.75rem; cursor:pointer; color:var(--ink-3);
  font-family:var(--sans); font-size:var(--step-0); font-weight:500; letter-spacing:.01em;
  transition:color .15s ease, border-color .15s ease; display:flex; align-items:baseline; gap:.5rem; }
.tab:hover { color:var(--ink-2); }
.tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
.tab .file { font-family:var(--mono); font-size:var(--step--1); color:var(--ink-3); }

/* --- sections ------------------------------------------------------------ */
.panel[hidden] { display:none; }
section { padding:2.6rem 0; border-bottom:1px solid var(--border); }
section:last-child { border-bottom:0; }
.eyebrow { font-size:var(--step--1); text-transform:uppercase; letter-spacing:.1em;
  color:var(--ink-3); font-weight:600; margin-bottom:.5rem; }
.h2 { font-size:var(--step-3); letter-spacing:-.012em; }
.lede { color:var(--ink-2); max-width:68ch; margin-top:.6rem; }
.section-head { margin-bottom:1.6rem; }

/* --- stat tiles ---------------------------------------------------------- */
.tiles { display:grid; gap:1px; background:var(--border); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden;
  grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background:var(--surface); padding:1rem 1.1rem; }
.tile .v { font-family:var(--mono); font-size:var(--step-4); font-weight:500;
  letter-spacing:-.02em; line-height:1.1; font-variant-numeric:tabular-nums; }
.tile .k { color:var(--ink-3); font-size:var(--step--1); margin-top:.3rem;
  text-transform:uppercase; letter-spacing:.06em; }
.tile .sub { color:var(--ink-2); font-size:var(--step--1); margin-top:.35rem; }

/* --- cards --------------------------------------------------------------- */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
.grid { display:grid; gap:1rem; }
.cols-2 { grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); }
.cols-3 { grid-template-columns:repeat(auto-fit, minmax(270px, 1fr)); }

.area { padding:1.05rem 1.15rem; display:flex; flex-direction:column; gap:.7rem; }
.area-top { display:flex; justify-content:space-between; gap:1rem; align-items:baseline; }
.area h3 { font-size:var(--step-2); letter-spacing:-.01em; }
.area .key { font-family:var(--mono); font-size:var(--step--1); color:var(--ink-3); }
.area p { margin:0; color:var(--ink-2); font-size:var(--step-0); }
.meta-row { display:flex; flex-wrap:wrap; gap:.35rem .5rem; align-items:center; }
.pill { font-size:var(--step--1); padding:.14rem .45rem; border-radius:99px;
  border:1px solid var(--border-strong); color:var(--ink-2); white-space:nowrap; }
.pill.accent { border-color:var(--accent); color:var(--accent-deep); background:var(--accent-wash); }
.pill.warn { border-color:var(--warn); color:var(--warn); background:var(--warn-wash); }
.pill.mono { font-family:var(--mono); }

/* --- bars ---------------------------------------------------------------- */
.bars { display:flex; flex-direction:column; gap:.3rem; }
.bar-row { display:grid; grid-template-columns:minmax(90px, 30%) 1fr auto; gap:.7rem;
  align-items:center; font-size:var(--step-0); }
.bar-row .lbl { color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-track { background:var(--track); border-radius:3px; height:11px; position:relative; }
.bar-fill { background:var(--accent); height:100%; border-radius:0 3px 3px 0; min-width:2px;
  transition:filter .15s ease; }
.bar-row:hover .bar-fill { filter:brightness(1.12); }
.bar-row .val { font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:var(--step--1); color:var(--ink); min-width:3.4em; text-align:right; }

/* --- tables -------------------------------------------------------------- */
.scroll { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--surface); }
table { border-collapse:collapse; width:100%; font-size:var(--step-0); }
th { text-align:left; font-weight:600; font-size:var(--step--1); text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-3); padding:.6rem .8rem; white-space:nowrap;
  border-bottom:1px solid var(--border); background:var(--surface-2); position:sticky; top:0; }
td { padding:.55rem .8rem; border-bottom:1px solid var(--border); vertical-align:top; }
tbody tr:last-child td { border-bottom:0; }
tbody tr:hover { background:var(--surface-2); }
td.n, th.n { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* --- misc ---------------------------------------------------------------- */
.note { border-left:2px solid var(--accent); background:var(--surface-2);
  padding:.7rem .95rem; border-radius:0 var(--radius) var(--radius) 0; color:var(--ink-2);
  max-width:72ch; }
.note.warn { border-left-color:var(--warn); }
.note b { color:var(--ink); font-weight:600; }
.add { color:var(--added); } .del { color:var(--removed); }
.muted { color:var(--ink-3); }
.stack { display:flex; flex-direction:column; gap:1rem; }
.chain { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; font-family:var(--mono);
  font-size:var(--step--1); }
.chain span { border:1px solid var(--border-strong); border-radius:4px; padding:.22rem .5rem;
  background:var(--surface); color:var(--ink-2); }
.chain span.hi { border-color:var(--accent); color:var(--accent-deep); background:var(--accent-wash); }
.chain i { color:var(--ink-3); font-style:normal; }

/* --- filters + explorer -------------------------------------------------- */
.filters { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-bottom:1rem; }
.search { flex:1 1 220px; min-width:180px; padding:.45rem .65rem; font-family:var(--sans);
  font-size:var(--step-0); color:var(--ink); background:var(--surface);
  border:1px solid var(--border-strong); border-radius:var(--radius); }
.search::placeholder { color:var(--ink-3); }
.fchip { appearance:none; cursor:pointer; font-family:var(--sans); font-size:var(--step--1);
  padding:.3rem .6rem; border-radius:99px; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--ink-2); transition:all .12s ease; }
.fchip:hover { border-color:var(--ink-3); color:var(--ink); }
.fchip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent);
  color:var(--on-accent); }
.ep-row { cursor:pointer; }
.ep-row td:first-child { font-family:var(--mono); font-size:var(--step--1); color:var(--ink-3); }
.ep-title { font-weight:500; }
.ep-sub { color:var(--ink-3); font-size:var(--step--1); margin-top:.15rem;
  display:flex; gap:.5rem; flex-wrap:wrap; }
.detail td { background:var(--surface-2); padding:1rem 1.1rem; }
.detail-grid { display:grid; gap:1.1rem; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); }
.detail h4 { font-size:var(--step--1); text-transform:uppercase; letter-spacing:.07em;
  color:var(--ink-3); font-family:var(--sans); font-weight:600; margin-bottom:.4rem; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:.15rem .7rem; font-size:var(--step--1); }
.kv dt { color:var(--ink-3); } .kv dd { margin:0; font-family:var(--mono); }
.flist { font-family:var(--mono); font-size:var(--step--1); display:flex;
  flex-direction:column; gap:.15rem; }
.flist div { display:flex; gap:.6rem; justify-content:space-between; }
.flist .p { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl;
  text-align:left; color:var(--ink-2); }
.type-dot { display:inline-block; width:8px; height:8px; border-radius:2px;
  background:var(--accent); margin-right:.4rem; vertical-align:baseline; }

/* --- diffs --------------------------------------------------------------- */
.diff { font-family:var(--mono); font-size:var(--step--1); line-height:1.45;
  overflow-x:auto; background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--radius); padding:.6rem .75rem; margin:0; white-space:pre; }
.diff .a { color:var(--added); }
.diff .r { color:var(--removed); }
.diff .h { color:var(--ink-3); }
.diff .m { color:var(--cat-2); }
.triple { display:flex; flex-direction:column; gap:.55rem; padding:1rem 1.1rem; }
.triple-head { display:flex; flex-wrap:wrap; gap:.4rem .8rem; align-items:baseline;
  justify-content:space-between; }
.triple .p { font-family:var(--mono); font-size:var(--step-0); word-break:break-all; }
.flow { display:flex; align-items:center; gap:.45rem; flex-wrap:wrap;
  font-family:var(--mono); font-size:var(--step--1); color:var(--ink-3); }
.flow b { color:var(--ink); font-weight:500; }

/* --- interpreted layer ---------------------------------------------------
   Everything read by a model rather than measured wears the second validated
   hue, consistently, so the distinction is visible without reading a label. */
.interpreted { border-left:2px solid var(--cat-2); }
.pill.interp { border-color:var(--cat-2); color:var(--cat-2); background:transparent; }
.badge-interp { font-size:var(--step--1); color:var(--cat-2); border:1px solid var(--cat-2);
  border-radius:99px; padding:.1rem .45rem; white-space:nowrap; }
.inferred { background:var(--surface-3); border-radius:var(--radius); padding:.6rem .75rem;
  border-left:2px solid var(--cat-2); }
.inferred h5 { margin:0 0 .3rem; font-family:var(--sans); font-size:var(--step--1);
  text-transform:uppercase; letter-spacing:.07em; color:var(--cat-2); font-weight:600; }
.conf { font-family:var(--mono); font-size:var(--step--1); color:var(--ink-3); }

/* --- era band ------------------------------------------------------------ */
.eras { display:flex; gap:2px; margin-top:.5rem; }
.era-band { position:relative; border-radius:3px; background:var(--cat-2); opacity:.22;
  height:34px; transition:opacity .12s ease; }
.era-band:hover { opacity:.42; }
.era-band.on { opacity:.55; }
.era-labels { display:flex; gap:2px; margin-top:.35rem; }
.era-labels div { font-size:var(--step--1); color:var(--ink-2); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.era-card { padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.6rem; }
.era-card h3 { font-size:var(--step-2); }

/* --- person cards -------------------------------------------------------- */
.person { padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.6rem; }
.person h3 { font-size:var(--step-1); }
.person .headline { color:var(--ink-2); font-size:var(--step-0); }
.arc { display:flex; flex-direction:column; gap:.45rem; }
.arc-step { display:grid; grid-template-columns:minmax(120px,26%) 1fr; gap:.7rem;
  font-size:var(--step--1); }
.arc-step .era { color:var(--cat-2); font-family:var(--mono); }
.tl-list { display:flex; flex-direction:column; }
.tl-item { display:grid; grid-template-columns:92px 150px 1fr; gap:.9rem; padding:.55rem 0;
  border-bottom:1px solid var(--border); align-items:baseline; }
.tl-item:last-child { border-bottom:0; }
.tl-item .d { font-family:var(--mono); font-size:var(--step--1); color:var(--ink-3); }

/* --- timeline ------------------------------------------------------------ */
.timeline { display:flex; align-items:flex-end; gap:2px; height:120px; }
.tl-col { flex:1; background:var(--accent); min-height:2px; border-radius:2px 2px 0 0;
  position:relative; transition:filter .12s ease; }
.tl-col:hover { filter:brightness(1.2); }
.tl-axis { display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:var(--step--1); color:var(--ink-3); margin-top:.4rem; }

#tip { position:fixed; z-index:60; pointer-events:none; opacity:0; transition:opacity .1s ease;
  background:var(--ink); color:var(--bg); font-family:var(--mono); font-size:var(--step--1);
  padding:.35rem .55rem; border-radius:4px; max-width:280px; box-shadow:var(--shadow); }
#tip.on { opacity:1; }
footer { padding:2rem 0 3rem; color:var(--ink-3); font-size:var(--step--1); }
</style>

<div id="tip" role="status" aria-live="polite"></div>

<header class="masthead">
  <div class="wrap masthead-inner">
    <div>
      <h1 class="title">Curator Ground Truth</h1>
      <p class="subtitle">Everything SWEWorld knows about the repository its synthetic

<nav class="tabs" aria-label="Views">

<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("report-data").textContent);
const G = DATA.grounding, E = DATA.episodes;

/* ---------- helpers ---------- */
const h = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
};
const n = x => (x === null || x === undefined) ? "—" : x.toLocaleString("en-US");
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "—";
const short = s => s ? s.slice(0, 10) : "—";
const dur = s => {
  if (s === null || s === undefined) return "—";
  const hrs = s / 3600;
  if (hrs < 1) return Math.round(s / 60) + "m";
  if (hrs < 48) return (hrs < 10 ? hrs.toFixed(1) : Math.round(hrs)) + "h";
  return Math.round(hrs / 24) + "d";
};

/* One shared tooltip; charts attach data-tip and it follows the pointer. */
const tip = document.getElementById("tip");
document.addEventListener("pointermove", ev => {
  const target = ev.target.closest("[data-tip]");
  if (!target) { tip.classList.remove("on"); return; }
  tip.textContent = target.dataset.tip;
  tip.classList.add("on");
  const pad = 14, box = tip.getBoundingClientRect();
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + box.width > innerWidth - 8) x = ev.clientX - box.width - pad;
  if (y + box.height > innerHeight - 8) y = ev.clientY - box.height - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

const tiles = items => h("div", { class: "tiles" },
  items.map(t => h("div", { class: "tile" },
    h("div", { class: "v" }, t.v), h("div", { class: "k" }, t.k),
    t.sub ? h("div", { class: "sub" }, t.sub) : null)));

/* Magnitude comparison on one dimension: horizontal bars, one hue, sorted. */
const bars = (items, opts = {}) => {
  const max = Math.max(...items.map(i => i.value), 1);
  return h("div", { class: "bars" }, items.map(i => h("div", { class: "bar-row" },
    h("div", { class: "lbl", title: i.full || i.label }, i.label),
    h("div", { class: "bar-track", "data-tip": (i.full || i.label) + " — " + (i.tip || n(i.value)) },
      h("div", {
        class: "bar-fill",
        style: `width:${Math.max(1.5, 100 * i.value / max)}%${i.color ? `;background:${i.color}` : ""}`
      })),
    h("div", { class: "val" }, opts.format ? opts.format(i.value) : n(i.value)))));
};

const sectionHead = (eyebrow, title, lede) => h("div", { class: "section-head" },
  h("div", { class: "eyebrow" }, eyebrow),
  h("h2", { class: "h2" }, title),
  lede ? h("p", { class: "lede" }, lede) : null);

const table = (headers, rows) => h("div", { class: "scroll" },
  h("table", {},
    h("thead", {}, h("tr", {}, headers.map(head =>
      h("th", { class: head.n ? "n" : null }, head.label || head)))),

            h("dt", {}, "across all refs"), h("dd", {}, n(H.dag.all_refs)),
            h("dt", {}, "reachable from HEAD"), h("dd", {}, n(H.dag.on_head)),
            h("dt", {}, "side branches only"), h("dd", {}, n(H.dag.side_branch_only)),
            h("dt", {}, "landings on main"), h("dd", {}, n(H.dag.first_parent)),
            h("dt", {}, "merges"), h("dd", {}, n(H.dag.merges))),
          h("h4", { class: "eyebrow" }, "Commits per year"),
          bars(years.map(([y, c]) => ({ label: y, value: c })))),
        h("div", { class: "card area" },
          h("h3", {}, "Branches with unmerged work"),
          bars(H.branches.filter(b => b.commits_not_on_head > 0).map(b => ({
            label: b.name.replace(/^origin\//, ""), full: b.name,
            value: b.commits_not_on_head,
            tip: b.commits_not_on_head + " commits not on HEAD" }))),
          h("h4", { class: "eyebrow" }, "Recent releases"),
          h("div", { class: "flist" }, H.releases.slice(-8).reverse().map(rel => h("div", {},
            h("span", { class: "p" }, rel.tag || rel.name),
            h("span", { class: "muted" }, rel.published))))))));
  }

  /* --- what was kept and what was not --- */
  p4.append(h("section", {},
    sectionHead("Retention", "What is kept, and what is deliberately not",
      "Lockfiles, recorded HTTP cassettes and binaries are bulk with nothing to adapt, so " +
      "their diffs and contents are skipped. The exclusions are listed rather than silently " +
      "applied."),
    h("div", { class: "grid cols-2" },
      h("div", { class: "card area" },
        h("h3", {}, "Kept"),
        h("dl", { class: "kv" },
          h("dt", {}, "file patches"), h("dd", {}, n(r.patch_stats.files_with_patch)),
          h("dt", {}, "patch bytes"), h("dd", {}, n(r.patch_stats.patch_bytes)),
          h("dt", {}, "truncated"), h("dd", {},
            r.patch_stats.truncated + " over " + n(r.max_file_patch_bytes) + " B"),
          h("dt", {}, "blobs stored"), h("dd", {}, n(r.blob_stats.blobs)),
          h("dt", {}, "blob bytes"), h("dd", {}, n(r.blob_stats.bytes))),
        h("h4", { class: "eyebrow" }, "Stored file versions by language"),
        bars(Object.entries(H.blob_languages).map(([k, v]) => ({ label: k, value: v })))),
      h("div", { class: "card area" },
        h("h3", {}, "Skipped as noise"),
        bars(Object.entries(H.noise_excluded).map(([k, v]) => ({
          label: k, value: v, color: "var(--ink-3)",
          tip: v + " file changes skipped" }))),
        h("p", { class: "note", style: "margin-top:.6rem" },
          h("b", {}, "Why. "),
          "These are bulk with nothing to adapt — recorded HTTP fixtures, lockfiles and " +
          "binaries. " + n(r.patch_stats.skipped_noise) + " file changes were skipped on " +
          "that basis; the pattern that decides is in ",
          h("span", { class: "mono" }, "retention.noise_pattern"), ".")))));

  /* --- how they write --- */
  {
    const cs = H.patterns.commit_subjects, b = H.patterns.bodies;
    const yearly = Object.entries(H.patterns.commit_subjects_by_year);
    p4.append(h("section", {},
      sectionHead("Voice", "How this team writes",
        "Message and title conventions, measured — the raw material for making synthetic " +
        "commits and pull requests sound like they came from this repository."),
      h("div", { class: "grid cols-2" },
        h("div", { class: "card area" },
          h("h3", {}, "Commit subjects"),
          h("div", { class: "meta-row" },
            h("span", { class: "pill mono" }, "p50 " + cs.length.p50 + " chars"),
            h("span", { class: "pill mono" },
              Math.round(cs.conventional_share * 100) + "% conventional"),
            h("span", { class: "pill mono" },
              Math.round(cs.starts_capitalised * 100) + "% capitalised"),
            h("span", { class: "pill mono" },
              Math.round(b.share_with_body * 100) + "% have a body")),
          h("h4", { class: "eyebrow" }, "Prefixes actually used"),
          bars(Object.entries(cs.conventional_prefixes).slice(0, 10)
            .map(([k, v]) => ({ label: k + ":", value: v }))),
          (() => {
            const ranked = Object.entries(cs.conventional_prefixes);
            if (!ranked.length) return null;
            const [top, topN] = ranked[0];
            const spec = ["feat", "fix", "chore", "docs", "test", "refactor", "perf",
                          "build", "ci", "style", "revert"];
            return h("p", { class: "note", style: "margin-top:.5rem" },
              h("b", {}, "Most-used prefix: "), h("span", { class: "mono" }, top + ":"),
              ` (${topN} uses)`,
              spec.includes(top) ? "." :
                " — which is not part of the Conventional Commits spec at all. Reading a " +
                "project's conventions off its own history beats assuming the standard ones.");
          })()),
        h("div", { class: "card area" },
          h("h3", {}, "Pull request titles and branches"),
          h("div", { class: "meta-row" },
            h("span", { class: "pill mono" },
              "p50 " + H.patterns.pull_request_titles.length.p50 + " chars"),
            h("span", { class: "pill mono" },
              Math.round(H.patterns.pull_request_titles.conventional_share * 100) +
              "% conventional")),
          h("h4", { class: "eyebrow" }, "Branch name prefixes"),
          bars(Object.entries(H.patterns.branch_name_prefixes).slice(0, 10)
            .map(([k, v]) => ({ label: k, value: v }))),
          h("h4", { class: "eyebrow" }, "Trailers and links"),
          h("dl", { class: "kv" },
            h("dt", {}, "Co-authored-by"), h("dd", {}, n(b.co_authored_by)),
            h("dt", {}, "Signed-off-by"), h("dd", {}, n(b.signed_off_by)),
            h("dt", {}, "closes an issue"), h("dd", {}, n(b.closes_an_issue))),
          h("h4", { class: "eyebrow" }, "Conventional share by year"),
          bars(yearly.map(([y, v]) => ({
            label: y, value: Math.round(v.conventional_share * 100),
            tip: Math.round(v.conventional_share * 100) + "% of " + v.count + " subjects" })),
            { format: v => v + "%" })))));
  }
}

/* ---------- tabs ---------- */
const panels = { "tab-codebase": "panel-codebase", "tab-work": "panel-work",
                 "tab-org": "panel-org", "tab-raw": "panel-raw" };
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    for (const [t, p] of Object.entries(panels)) {
      const on = t === tab.id;
      document.getElementById(t).setAttribute("aria-selected", String(on));
      document.getElementById(p).hidden = !on;
    }
    scrollTo({ top: 0, behavior: "instant" });
  });
});

document.getElementById("footer").append(
  h("div", {}, "Generated " + G.generated_at + " by data_gen/analyze_repository.py and " +
    "data_gen/build_episodes.py, then projected by data_gen/make_report.py."),
  h("div", {}, "Every number here comes from those two files. Nothing is computed in this page."),
);
</script>
