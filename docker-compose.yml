# =============================================================================
# SWEWorld — self-hosted world environment
# =============================================================================
# Four user-facing services behind one Traefik proxy, each with its own backing
# store. Everything is HTTPS, served with a local CA generated by
# scripts/gen-certs.sh and trusted by both the browser and the containers.
#
# HTTPS is not a preference here — Outline hardcodes `secure: env.isProduction`
# on its OAuth CSRF cookie, so signing in over plain HTTP fails outright with
# "Cannot send secure cookie over unencrypted connection". See README.md.
#
#   ./scripts/bootstrap.sh && ./scripts/verify.sh
# =============================================================================

name: sweworld

# -----------------------------------------------------------------------------
# Shared fragments
# -----------------------------------------------------------------------------
x-postgres-common: &postgres-common
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [world]
  environment:
    TZ: ${TZ:-UTC}
  # Every service waits on `condition: service_healthy` against this, so the
  # app containers never race their database through a first-boot migration.
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s

networks:
  world:
    name: sweworld

volumes:
  gitea-data:
  gitea-db-data:
  outline-db-data:
  outline-redis-data:
  mattermost-db-data:
  minio-data:
  mattermost-data:
  mattermost-config:
  mattermost-logs:
  mattermost-plugins:
  mattermost-client-plugins:
  mattermost-bleve:
  maddy-data:
  roundcube-data:

services:

  # ===========================================================================
  # Traefik — subdomain router
  # ===========================================================================
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sweworld
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Everything is HTTPS. Outline hardcodes Secure on its OAuth CSRF cookie
      # when NODE_ENV=production, so plain HTTP cannot complete a login.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./config/tls:/certs:ro
    networks:
      world:
        # THE LOAD-BEARING BIT. These aliases make git.world.local (etc.)
        # resolve to Traefik *from inside the network*, not just from the host's
        # /etc/hosts. Outline performs its OIDC token exchange against
        # https://git.world.local server-side, so container and browser must
        # agree on one URL. Without these, Outline sign-in fails with ENOTFOUND.
        aliases:
          - git.${WORLD_DOMAIN:-world.local}
          - docs.${WORLD_DOMAIN:-world.local}
          - chat.${WORLD_DOMAIN:-world.local}
          - mail.${WORLD_DOMAIN:-world.local}

  # ===========================================================================
  # Gitea — git server, and OIDC provider for Outline
  # ===========================================================================
  gitea-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME}
      POSTGRES_USER: ${GITEA_DB_USER}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - gitea-db-data:/var/lib/postgresql/data

  gitea:
    image: gitea/gitea:1.27
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      TZ: ${TZ:-UTC}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__DOMAIN: git.${WORLD_DOMAIN:-world.local}
      GITEA__server__SSH_DOMAIN: git.${WORLD_DOMAIN:-world.local}
      GITEA__server__ROOT_URL: https://git.${WORLD_DOMAIN:-world.local}/
      GITEA__server__HTTP_PORT: 3000
      # Skip the interactive web installer so the stack comes up unattended.
      GITEA__security__INSTALL_LOCK: "true"
      # A closed world: nobody signs themselves up, personas are created by
      # bootstrap/ingestion. Keeps the persona list authoritative.
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      # OAuth2 provider — this is what makes Outline's login work.
      GITEA__oauth2__ENABLED: "true"
      GITEA__oauth2__DEFAULT_APPLICATIONS: ""
      GITEA__repository__DEFAULT_BRANCH: main
      # Ingestion replays history with arbitrary author timestamps; don't let
      # Gitea reject pushes for having old dates or large diffs.
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      GITEA__repository__ENABLE_PUSH_CREATE_ORG: "true"
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks: [world]
    labels:
      traefik.enable: "true"
      traefik.docker.network: sweworld
      traefik.http.routers.gitea.rule: Host(`git.${WORLD_DOMAIN:-world.local}`)
      traefik.http.routers.gitea.entrypoints: websecure
      traefik.http.routers.gitea.tls: "true"
      traefik.http.services.gitea.loadbalancer.server.port: "3000"

  # ===========================================================================
  # Outline — Notion-style docs (Postgres + Redis + MinIO)
  # ===========================================================================
  outline-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: ${OUTLINE_DB_NAME}
      POSTGRES_USER: ${OUTLINE_DB_USER}
      POSTGRES_PASSWORD: ${OUTLINE_DB_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - outline-db-data:/var/lib/postgresql/data

  outline-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [world]
    volumes:
      - outline-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - minio-data:/data
    networks: [world]

  # One-shot: creates the bucket Outline uploads into, then exits 0. Retries in
  # a loop rather than depending on a minio healthcheck, because the minio
  # image ships no shell utilities to health-check itself with.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    networks: [world]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        mc alias set world http://minio:9000 '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}' && break;
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing world/${MINIO_BUCKET} &&
      echo 'bucket ${MINIO_BUCKET} ready'
      "

  outline:
    image: outlinewiki/outline:1.9.2
    restart: unless-stopped
    depends_on:
      outline-db:
        condition: service_healthy
      outline-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      # Makes Node trust the local CA, so Outline's server-side OIDC token
      # exchange against https://git.world.local succeeds. The alternative
      # (NODE_TLS_REJECT_UNAUTHORIZED=0) disables verification process-wide.
      NODE_EXTRA_CA_CERTS: /certs/world-ca.crt
      URL: https://docs.${WORLD_DOMAIN:-world.local}
      PORT: 3000
      # Both must be `openssl rand -hex 32`; Outline validates the length.
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      DATABASE_URL: postgres://${OUTLINE_DB_USER}:${OUTLINE_DB_PASSWORD}@outline-db:5432/${OUTLINE_DB_NAME}
      PGSSLMODE: disable
      REDIS_URL: redis://outline-redis:6379
      # Traefik terminates TLS and redirects :80 -> :443, so this is safe and
      # keeps generated links (share URLs, email) on https.
      FORCE_HTTPS: "true"

      # --- S3 (MinIO) --------------------------------------------------------
      FILE_STORAGE: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      AWS_S3_UPLOAD_BUCKET_URL: http://minio:9000
      AWS_S3_UPLOAD_BUCKET_NAME: ${MINIO_BUCKET}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_S3_ACL: private

      # --- Auth: Gitea as the OIDC provider ----------------------------------
      # Outline ships no password login. These endpoints are Gitea's; see
      # http://git.world.local/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${OUTLINE_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET}
      OIDC_AUTH_URI: https://git.${WORLD_DOMAIN:-world.local}/login/oauth/authorize
      OIDC_TOKEN_URI: https://git.${WORLD_DOMAIN:-world.local}/login/oauth/access_token
      OIDC_USERINFO_URI: https://git.${WORLD_DOMAIN:-world.local}/login/oauth/userinfo
      OIDC_USERNAME_CLAIM: preferred_username
      OIDC_DISPLAY_NAME: Gitea
      OIDC_SCOPES: openid profile email

      # --- Mail (magic links; only works for already-existing users) ---------
      SMTP_HOST: maddy
      SMTP_PORT: 587
      SMTP_USERNAME: ${MAIL_ADMIN_USER}
      SMTP_PASSWORD: ${MAIL_ADMIN_PASSWORD}
      SMTP_FROM_EMAIL: ${MAIL_ADMIN_USER}
      SMTP_SECURE: "false"
    # Overrides the image's baked-in healthcheck, which polls every 60s with no
    # start_period. Traefik's docker provider refuses to route to a container
    # that is not `healthy`, so with the stock check Outline 404s for up to a
    # full minute after every start — long enough to look like a broken config.
    healthcheck:
      # X-Forwarded-Proto is required: FORCE_HTTPS makes Outline 301 any request
      # it believes is insecure, which would turn this probe into a redirect and
      # keep the container permanently unhealthy (and therefore unrouted).
      test: ["CMD-SHELL", "wget -qO- --header='X-Forwarded-Proto: https' http://localhost:3000/_health | grep -q OK || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./config/tls:/certs:ro
    networks: [world]
    labels:
      traefik.enable: "true"
      traefik.docker.network: sweworld
      traefik.http.routers.outline.rule: Host(`docs.${WORLD_DOMAIN:-world.local}`)
      traefik.http.routers.outline.entrypoints: websecure
      traefik.http.routers.outline.tls: "true"
      traefik.http.services.outline.loadbalancer.server.port: "3000"

  # ===========================================================================
  # Mattermost — Slack-style chat
  # ===========================================================================
  mattermost-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: ${MM_DB_NAME}
      POSTGRES_USER: ${MM_DB_USER}
      POSTGRES_PASSWORD: ${MM_DB_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - mattermost-db-data:/var/lib/postgresql/data

  # The mattermost image runs as uid 2000 and cannot chown its own named
  # volumes, which docker creates root-owned. This one-shot fixes ownership
  # before the app starts. Without it the server dies on "permission denied".
  mattermost-init:
    image: alpine:3.20
    restart: "no"
    user: root
    command: >
      sh -c "chown -R 2000:2000 /mm/data /mm/config /mm/logs /mm/plugins /mm/client-plugins /mm/bleve && echo 'mattermost dirs chowned'"
    volumes:
      - mattermost-data:/mm/data
      - mattermost-config:/mm/config
      - mattermost-logs:/mm/logs
      - mattermost-plugins:/mm/plugins
      - mattermost-client-plugins:/mm/client-plugins
      - mattermost-bleve:/mm/bleve

  mattermost:
    image: mattermost/mattermost-team-edition:11.9
    restart: unless-stopped
    depends_on:
      mattermost-db:
        condition: service_healthy
      mattermost-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-UTC}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${MM_DB_USER}:${MM_DB_PASSWORD}@mattermost-db:5432/${MM_DB_NAME}?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: https://chat.${WORLD_DOMAIN:-world.local}
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      # Local mode exposes an admin socket inside the container, letting
      # bootstrap.sh and ingest_chat.py drive `mmctl --local` with no token and
      # no network auth. This is how the bulk import gets run.
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_LOCALMODESOCKETLOCATION: /var/tmp/mattermost_local.socket
      # Bulk import needs these; defaults are too small for a world's history.
      MM_FILESETTINGS_MAXFILESIZE: "104857600"
      MM_SERVICESETTINGS_ENABLEAPIV3: "false"
      # Let ingestion post messages with historical timestamps.
      MM_SERVICESETTINGS_ENABLEAPICHANNELDELETION: "true"
    volumes:
      - mattermost-data:/mattermost/data
      - mattermost-config:/mattermost/config
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client-plugins
      - mattermost-bleve:/mattermost/bleve-indexes
    networks: [world]
    labels:
      traefik.enable: "true"
      traefik.docker.network: sweworld
      traefik.http.routers.mattermost.rule: Host(`chat.${WORLD_DOMAIN:-world.local}`)
      traefik.http.routers.mattermost.entrypoints: websecure
      traefik.http.routers.mattermost.tls: "true"
      traefik.http.services.mattermost.loadbalancer.server.port: "8065"

  # ===========================================================================
  # Mail — Maddy (SMTP+IMAP) + Roundcube (webmail)
  # ===========================================================================
  maddy:
    image: foxcpp/maddy:0.9
    restart: unless-stopped
    environment:
      MADDY_HOSTNAME: ${MAIL_HOSTNAME}
      MADDY_DOMAIN: ${MAIL_DOMAIN}
      TZ: ${TZ:-UTC}
    volumes:
      - maddy-data:/data
      # Explicit config instead of maddy's auto-generated one: the default does
      # real outbound MX delivery with DKIM/SPF/DMARC, all of which is wrong (and
      # slow to fail) for a closed .local world with no DNS.
      - ./config/maddy/maddy.conf:/data/maddy.conf:ro
      # Maddy refuses to start without a cert on disk. bootstrap.sh generates a
      # self-signed pair here.
      - ./config/maddy/tls:/data/tls:ro
    ports:
      # Published straight to the host, bypassing Traefik (which proxies HTTP
      # only) so scripts/ingest_mail.py can speak raw IMAP from outside docker.
      - "${SMTP_PORT:-25}:25"
      - "${SUBMISSION_PORT:-587}:587"
      - "${IMAP_PORT:-143}:143"
      - "${IMAPS_PORT:-993}:993"
    networks: [world]

  roundcube:
    image: roundcube/roundcubemail:1.7.3-apache
    restart: unless-stopped
    depends_on: [maddy]
    environment:
      TZ: ${TZ:-UTC}
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: maddy
      ROUNDCUBEMAIL_DEFAULT_PORT: "143"
      ROUNDCUBEMAIL_SMTP_SERVER: maddy
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    volumes:
      - roundcube-data:/var/roundcube/db
    networks: [world]
    labels:
      traefik.enable: "true"
      traefik.docker.network: sweworld
      traefik.http.routers.roundcube.rule: Host(`mail.${WORLD_DOMAIN:-world.local}`)
      traefik.http.routers.roundcube.entrypoints: websecure
      traefik.http.routers.roundcube.tls: "true"
      traefik.http.services.roundcube.loadbalancer.server.port: "80"
