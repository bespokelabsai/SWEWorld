# Every harbor task in this directory, in one job.
#
# `-p harbor_tasks` does NOT do this. Harbor expands a dataset directory with a
# single non-recursive `iterdir()`, so a folder of folders-of-tasks reads as a
# folder with no tasks in it. Each group directory is named here instead:
#
#     harbor run -c harbor_tasks/all.yaml -a oracle
#
# One group at a time is the same command with -p:
#
#     harbor run -p harbor_tasks/t1-cache-stats -a oracle
datasets:
  - path: harbor_tasks/t0-smoke
  - path: harbor_tasks/t1-cache-stats
  - path: harbor_tasks/t2-batch-cost-estimate
  - path: harbor_tasks/t3-shared-limiter
  - path: harbor_tasks/t4-deepseek-empty-retry
