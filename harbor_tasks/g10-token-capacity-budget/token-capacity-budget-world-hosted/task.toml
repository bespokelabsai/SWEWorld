schema_version = "1.4"

[task]
name = "bespokelabs/token-capacity-budget"
version = "1.0.0"
description = "Online token-capacity budget: reservation, refund and reported limits. The requirements that decide correctness are not stated. The remarks they were inferred from are in the company's chat, wiki and mail, and the agent has to find them."
authors = [{ name = "SWEWorld" }]

# `TokenLimitStrategy.seperate`, below and throughout the ticket, is upstream
# curator's own spelling: a real enum member on the repository's main, referenced
# by all three provider processors. The ticket moves that enum into the new
# module and re-exports it, so the member name has to survive the move --
# correcting it would rename a public API the ticket never asked to rename. The
# leading underscore of `_TokenUsage` is upstream's too.
[metadata]
author_name = "Nidhi Parthasarathy"
author_email = "nidhi@bespokelabs.ai"
author_organization = "Bespoke Labs"
category = "Software"
subcategory = "Rate limiting and capacity accounting"
tags = ["python", "rate-limiting", "token-bucket", "http-headers", "retry-handling", "asyncio", "requirements-discovery"]
expert_time_estimate_hours = 6.0
difficulty_explanation = "The ticket is a precise but deliberately incomplete refactor of an LLM client's online request path: one module that decodes provider rate-limit headers, and a status tracker whose request and token buckets are seeded, refilled, reserved and settled through an injectable clock, wired into the retry handler and three provider processors. The requirements that decide correctness are not in it. Two further requirements, covering how far a token bucket may go into debt when a request under-estimates its usage and what a failed attempt gives back to the budget compared with a successful one, were settled in scattered remarks: chat threads, wiki pages and their comments, mail and code review, spread over months and mixed with earlier decisions the team later reversed. The hard part is the same for a human engineer and an agent: work out which of dozens of remarks bear on this change, tell a superseded decision from the current one, and reassemble exact names, constants and edge-case behaviour that no single remark states whole, while also delivering a correct cross-file change to bucket accounting that has to stay consistent across combined and separate token axes, unlimited and defaulted limits, a clock that can run backwards, and every exit of an async retry path. The accompanying company data (chat, wiki, mail and issue tracker) is synthetically generated around the real open-source curator repository and its real history. It is written to read like an ordinary engineering organisation, with realistic noise and reversals, so finding the evidence is a realistic retrieval-and-judgement challenge rather than a puzzle. In the real world this is the work of a backend or platform engineer on an LLM inference client, picking up a ticket in a codebase whose conventions live partly in team memory."
solution_explanation = "The reference solution (solution/oracle.patch, applied and pushed by solve.sh) adds a stdlib-only module status_tracker/capacity_budget.py holding the default limits, the TokenLimitStrategy enum, the single header-value decoder and read_rate_limit_headers, which returns a frozen RateLimitReading. The anthropic, litellm and openai processors delegate their header parsing to it, and the base processor applies a reading in one place. OnlineStatusTracker normalises its limits in __post_init__ (0 means defaulted, None means unlimited, shapes coerced to the strategy), seeds both buckets full, and does every refill, reservation check and settlement through its injected capacity_clock, rebinding a fresh _TokenUsage on every separate-axis change. The key insight is that a reservation is a debt the attempt must discharge exactly once on whichever path it leaves by. So the processor reserves through one synchronous _reserve_capacity, which is all-or-nothing, and releases on the success, requeued and exhausted exits of the retry handler. The hidden requirements are carried out in the tracker: consume, settlement and refund each end by clamping every limited token axis at a floor of minus a quarter of its limit and counting clamping calls, and a failed attempt refunds the whole blocked estimate plus its request slot through a separate refund_capacity, with settlements and refunds counted apart. The patch is then committed and merged to main in Gitea, which is how code reaches the graded and deployed state in this world."
verification_explanation = "The verifier clones whatever main holds in Gitea after the agent finishes and grades that, through two processes that never overlap. A WORKER, running as nobody from a jail holding only four answer-free files (probe.py, probe_support.py, fixture_spec.py, harness.py), imports the submission, drives it through this run's scenarios and records the raw values it observed - never a pass or a fail. A ROOT JUDGE, which never imports agent code, runs with Python in isolated mode (-I) and a root-owned HOME, reads those values plus the cloned source text, and writes one test per fact. Nothing the unprivileged worker writes can execute in the judge, and every path the judge opens goes through hardened reads that refuse a symlink, a non-regular file or anything over 8MiB, so a planted link cannot aim root at the answer key. No network, no real sleeping: the tracker is constructed directly on an injected clock and the processor is a stub subclass with canned responses. THE RUN'S INPUTS ARE DRAWN PER RUN. Root picks a seed once (secrets.token_hex(8)) and hands the same seed to both processes; fixture_spec.derive(seed) turns it into the run's limits, token estimates, reported usages, clock steps, header values and precedence numbers, and the judge recomputes from that seed what every answer must be - the refill, the settlement, the floor, the refund, the message an exception carries. It compares arithmetic, not remembered numbers. Only what the ticket fixes stays literal on both sides, because a value nobody may change cannot be a secret: the four DEFAULT_MAX_* limits, the three origin strings, the four header-name tuples, RateLimitReading's field order and frozen-ness, the rejected parse_limit_value forms, the enum members, and the counting semantics (one increment per operation). What the seed buys, measured: an observations file captured from one run and replayed against another scores 2 of 9 nodes and 2 of 8 hidden facts. What it does NOT buy, equally measured: the worker can read fixture_spec (it must, to build the scenarios), so a forgery can DERIVE this run's answers rather than remember them. That is why the hidden facts also read source. SOURCE CHECKS. Some rules no observed value can witness - a provider processor needs its client and a network before it answers a call, \"this stays exactly as it is\" is a statement about code rather than about a value, a release the per-minute cap swallows is invisible in every bucket reading, and a value the worker reports is a value the worker could have invented. For those the judge reads the pushed source as root (parsing text executes nothing, and the submission is not importable in that process) and, where the rule is a preservation rule, diffs the named function, class or declaration against the pristine copy of the library that run_suites.py stages at CURATOR_BASELINE_DIR - which is how a rule about code INSIDE a file the ticket edits is enforceable at all. A missing baseline fails the fact rather than passing it blind. PROTECTED FILES. Four files instruction.md:71 and :76 put out of scope and the reference solution never opens - cost.py, types/token_usage.py, types/generic_response.py and request_processor/config.py - are listed in tests/task.json's protected_files. Root byte-compares each with the pristine tree before any agent code is imported, records the verdict in the root-only /logs/verifier, and score.py holds the reward at 0 unless every one reads unchanged; a measurement that is missing reads as unmeasured, which is not a pass. Bytes are what an AST compare of those files could not do: RATE_LIMIT_HEADER.clear(), RATE_LIMIT_HEADER.update({...}) and RATE_LIMIT_HEADER[\"openai\"] = {...} are none of them an assignment to the name and none of them a new module-level binding, so the declaration diff read a pristine table while the running dict held whatever the submission had put in it (measured: all three now fail the byte compare and nothing else, and all three passed every judge node before it). The four AST compares the bytes subsume were deleted when they took over, so open_feature's twelve source checks read the pushed source twenty-three times where they read it twenty-seven, and the out-of-scope check makes nine comparisons where it made fifteen. Twelve source checks are carried by open_feature. (1) cool_down_if_rate_limit_error and the declarations of num_rate_limit_errors, time_of_last_rate_limit_error and start_time are AST-identical to pristine, no statement in the tracker, the base processor or the three provider processors writes num_rate_limit_errors or time_of_last_rate_limit_error where pristine does not, and OnlineStatusTracker and BaseOnlineRequestProcessor are each bound exactly as often and in the same way as the world binds them. The out-of-scope names that live in a file of their own are not checked here at all; see PROTECTED FILES. (2) The retry queue's own operations - put_nowait in handle_single_request_with_retries, empty and get in process_requests_from_file, every call the queue is handed to, and every statement that binds the queue to another name - are AST-identical to pristine, in the same order, and reached through the same chain of conditions. Only reachable statements are collected, and each one's enclosing statements are compared with their bodies blanked, so wrapping the drain or the requeue in `if False:`, or re-wrapping it in any other condition, changes the comparison and fails; the sibling statements are deliberately not compared, because the ticket's own edit stands beside two of them. The receiver and the assigned value are matched as expressions, not as bare names, so neither an alias nor locals()[\"retry_queue\"] escapes. (3) The anthropic and litellm readers call read_rate_limit_headers, and neither evaluates a string naming a header of its own (its docstring may name the family it delegates), carries a 4000/80000/400000 fallback, or assigns self.token_limit_strategy in place. (4) The openai reader delegates the header half while its RATE_LIMIT_HEADER loop, rps/tps scaling included, is AST-identical to pristine. (5) The three limit properties on BaseOnlineRequestProcessor are AST-identical to pristine, decorators included, which is what keeping their manual-then-header-then-default precedence means. (6) capacity_budget.py imports only stdlib modules (checked against sys.stdlib_module_names) plus bespokelabs, carries no `from __future__ import annotations`, evaluates no string naming a -remaining, -reset or llm_provider- header (docstrings and bare string statements are not reads, so a module may document what it does not consult), and substitutes no DEFAULT_* limit inside read_rate_limit_headers. (7) RateLimitReading is declared @dataclass(frozen=True) with its four fields in the ticket's order. (8) OnlineStatusTracker declares max_tokens_per_minute exactly once. (9) Both reservation loops are reachable and are the walrus form on _reserve_capacity with asyncio.sleep as their only await, and process_requests_from_file no longer asks has_capacity itself - a loop execution cannot enter reserves nothing. (10) handle_single_request_with_retries still has a try with except, else and finally, still uses invalid_finish_reasons, update_stats, update_cost_projection and append_generic_response, and is AST-identical to the pristine handler once the capacity releases the ticket adds are stripped from both sides - a statement that is nothing but a call to a capacity release, or an if left empty by removing one, is the edit the ticket asks for, and everything else in the method must read as the world shipped it. A release that mentions the retry queue under any name is not treated as a release, and neither is one whose arguments are anything but plain names, attributes or literals, so no requeue and no out-of-scope assignment can ride inside a statement the diff forgives. (11) The update_capacity refill and the __post_init__ re-seed reach self.capacity_clock - directly or through a tracker method they call - nothing outside those two paths reads it, update_capacity does not call time.time(), and _last_stats_update still does. (12) The dead free_capacity(self, tracker, tokens) helper is absent from BaseOnlineRequestProcessor's class body. Five more source checks are carried by the HIDDEN facts, one per thing an observation cannot witness: the debt floor fraction is declared in the capacity-budget module as exactly the fraction this judge holds AND is computed with somewhere in that module or the tracker (r1 rule, r1 scope, r1 exclusions); a debt-clamp counter is a tracker field starting at 0 that consume, refill, settlement or refund reachably increments, directly or through a helper it calls (r1 exclusions, r1 observability); the tracker declares a refund operation taking the blocked capacity and nothing else, and BaseOnlineRequestProcessor._refund_capacity delegates to it (r2 rule, r2 scope); the settlement and refund counters are separate fields starting at 0, each reachably incremented by its own operation or by something that operation calls, and neither free_capacity nor the refund operation touches the other's counter - how many places increment is the submission's business and exactly-one-per-call is graded behaviourally (r2 observability); and the except body of handle_single_request_with_retries reaches a refund on every terminal path - unconditionally, or in both branches of a conditional that is not the attempts_left test, so a refund only for requeued attempts fails (r2 scope, r2 exclusions). Each check accepts the same spellings the worker's tolerant readers accept, so a correct implementation that named its counter num_debt_clamps is read the same way by both halves. FACTS AND REWARD. The two hidden requirements are split into eight facts: rule, scope, exclusions and observability for each (neither has a failure-behaviour fact). Each fact passes only if all of its checks pass. The open ticket's behaviour is graded as one further test, open_feature: the constants and header tuples, value decoding, header reading and strategy selection, the reading's frozen shape and field order, tuple-order precedence between header names, the caller's mapping returned unmodified (compared against the mapping the seed drew, not against a worker verdict on it), seeding, refill, a backwards clock, defaulted and unlimited normalisation, shape coercion, the fresh _TokenUsage rebound on every seperate-axis change, CapacityExceedsLimitError, an empty bucket returning False beside the reading that made it empty, all-or-nothing _reserve_capacity, exactly one release per attempt on each of the three terminal paths, apply_rate_limit_reading, the limit properties' precedence, and the twelve source checks above. The reward is binary: 1 only if open_feature and all eight hidden facts pass, otherwise 0. A submission that recovers the hidden requirements but does not deliver the ticket therefore scores 0. Per-fact results and push/CI/deploy provenance are reported beside the reward in reward.json and ctrf.json; provenance is informational and does not gate it. EXACT CHECKS. Every value check is exact: the judge contains no approx, no isclose, no abs() and no tolerance of any kind. Values are compared with Python ==, so an int and a float of the same value compare equal and lists, strings and None must match exactly; a source comparison is equality of ast.dump, which forgives comments, formatting and line numbers but no expression. Exception checks require that the raised object's class chain contains both CapacityExceedsLimitError, the class the ticket names, and ValueError, that its axis, requested and limit attributes are exactly the drawn ones, and that str(exc) is the exact message the ticket prescribes - for the combined \"total\" axis and the seperate \"input\" axis alike, so a bare ValueError carrying the same three attributes fails. Assigning to a field of a RateLimitReading must raise something whose class chain contains FrozenInstanceError. Exact float equality is safe because it was measured on the bands the fixture actually draws, not assumed. Those bands are not uniform: combined token limits come in multiples of 600, the seperate per-axis limits in multiples of 500, request limits in multiples of 5, the refill steps that must cross a whole minute are multiples of 6 seconds or a whole minute, while the seperate-axis step is 1 or 2 seconds and the backwards-clock step a multiple of 2. Over 50,000 fresh seeds and every combination of those bands, all five orderings an implementation might write the refill in (L*e/60, L*(e/60), (e/60)*L, L/60*e, e*L/60) produce the identical double, the floored per-axis refill under seperate included, so no ordering an implementation is free to choose can move a graded value. Debt floors are an integer times a quarter, exactly representable. ONE-SIDED CHECKS, in full: the judge has four, all of them source counts, written as three >= 1 comparisons - the debt floor fraction must be computed with at least once in the capacity-budget module or the tracker (judge.py:1061), the debt-clamp counter must be incremented at least once inside a capacity operation (judge.py:1082), and the settlement and the refund counter must each be incremented at least once inside their own operation (judge.py:1113, once per counter). All four are one-sided for the same reason: how many places apply the floor or bump a counter is the submission's business, and whether anything does is not. Every other comparison in the judge is an equality. The worker computes one inequality, that the seeded last_update_time differs from the wall clock by more than 1e9 seconds, which is what shows it came from the injected clock (drawn in 500-2000) and not from time.time(). Every other worker-side boolean is an identity, presence or counting check, and the five that a source check does not back are noted here as such: TokenLimitStrategy re-exported as the same object, strategy.default is combined, each seperate-axis mutation returning an object that is not the one it replaced, has_capacity returning True on an unlimited axis, and an unlimited axis never raising. RESIDUAL, STATED PLAINLY. The worker is the process that runs agent code, so it can still write whatever it likes into observations.json; probe.py leaves through os._exit so that an atexit hook registered at import never fires, but that is a lock on one door rather than the fix. What closes the exploit is cost. Replaying a captured run fails (measured: 2/9 nodes). Deriving this run's answers from fixture_spec and reporting them from a tree that implements neither hidden requirement fails every hidden fact (measured: 0/8, on a tree with the floor, the refund and all three counters deleted, handed observations that were provably correct for that seed). What still passes is a tree that ships the declarations the source checks read - the fraction declared and computed with, the three counters, a refund operation, the processor's delegation, and the refund call on the except path - as live code, keeps the open ticket's own behaviour working under this run's inputs, and fakes only the hidden arithmetic behind them. That route is open and was re-measured on this build, not estimated: a tree whose floor is applied at half its fraction and whose refund returns two request slots, everything else live and unchanged, handed observations that were correct for the run's seed, scores 9 of 9 nodes, 8 of 8 hidden facts and reward 1. It is disclosed here because it is real: closing it needs the judge to establish the hidden arithmetic from something the worker cannot author, which is a change to how the facts are graded rather than another check. What the same measurement bounds is how much it costs - the faked half has to agree with this run's seeded inputs, and the declarations around it have to be live code. That is narrower than it reads: a declaration-only skeleton is no longer one of those trees. Those declarations have to be real code on a real path: every source count is taken over reachable statements only (a falsy literal test, a loop over an empty literal and anything after a return, raise, continue or break are dead), and each counter increment has to sit in the operation it counts or in something that operation calls, because a shim whose every graded statement was parked behind `while False:` or after a `return` passed all eight hidden facts before that was enforced. Every declaration the judge reads is also the one Python binds - the last, with a duplicate refused - because appending a gutted redefinition of either graded class left the source checks reading abandoned text while the live code implemented nothing. The same route through cost.py and types/generic_response.py is a protected file now: re-binding RATE_LIMIT_HEADER or re-exporting a second _TokenUsage still passes every judge node and still scores 0, on the byte compare. Reachability and enclosing control flow now cover the two checks that were left out of them, the retry queue's operations and the two reservation loops, so graded code that cannot run fails the open feature instead of passing on its text. The retry path is read, not driven: process_requests_from_file is not exercised behaviourally, because doing so costs ~50s of curator's own asyncio sleeps and risks hanging an honest submission, which would be a worse failure than the one it closes."

[agent]
# The world's engineer: uid 1000, no sudo, cannot reach supervisord, cannot read
# /opt/world-state or the deploy queue.
user = "ubuntu"
# 7200, not 3600. At an hour every g11 trial was still pushing, polling CI and
# re-running tests in its last minutes, so the cutoff -- not the hidden
# requirements -- was deciding how much got checked. The difficulty is meant to
# be finding what nobody wrote down, not racing the clock.
timeout_sec = 7200.0

[verifier]
# Root, because grading reads the pristine tree at /opt/world-state/input/curator
# (to tell an agent's new identifiers from curator's own) and the release
# symlinks under /opt/sweworld/curator, neither of which the agent can touch —
# so the state being graded cannot be forged.
user = "root"
# 2400, not 1800. Horizon's own lint rejects anything under 2000s, and the reason
# is worth keeping: a grader that overruns is KILLED, and a killed grader scores
# zero — so a perfect solution and a broken one produce the same result and
# nothing in the output says which happened.
timeout_sec = 2400.0

[environment]
# NO docker_image and NO docker-compose.yaml. One thin layer on the world image,
# booting supervisord through ENTRYPOINT (environment/task-entrypoint.sh).
# Harbor's compose template appends `command: ["sh","-c","sleep infinity"]`, and
# Compose's `command:` overrides CMD rather than ENTRYPOINT, so with a compose
# file those args reach supervisord as argv and the world never boots.
build_timeout_sec = 3600.0
# claude-code installs itself from downloads.claude.ai and calls the API.
# `allow_internet`, not `network_mode`: the benchmark's task.toml schema names
# only this one, and Harbor's default network mode is already public.
allow_internet = true
# The whole company runs in this one container: postgres for Mattermost,
# mariadb for BookStack, Mattermost, BookStack, Gitea AND its CI runner (the
# ticket is only done once CI is green on main), maddy for mail and nginx in
# front, plus the agent, its clone of curator and the pytest it writes. 13000MB
# is what that costs measured on the bake; the services idle, the runner is the
# only spike.
#
# cpus is 2 and NOT 8. Nothing about the task wants more compute -- the
# difficulty is finding what nobody wrote down -- but 0e81bc4 raised g7, g8 and
# g9 to 8 and missed this arm, so it boots the same world on a quarter of the
# cores. Raising it is not a free edit: Docker REFUSES a `cpus` above the host
# count rather than capping it, so an 8 here errors at `docker compose up` with
# zero spend unless the evaluation is submitted with
# `--machine-type e2-custom-8-16384`. It stays 2 until it is submitted that way.
cpus = 2
memory_mb = 13000
# storage_mb is 10240 on purpose, which is also the template's default -- stated
# rather than left implicit, because it is the one resource with little slack.
# The world image is ~6.7GB (`docker images sweworld:0.4.4`), and on top of it a
# run holds the agent's clone of curator, the pytest it writes, Gitea's CI
# runner workspace for the commit it pushes, and the databases the services
# write to. That is comfortably inside 10GB and nowhere near it: measured runs
# finish with headroom, and no rollout has hit ENOSPC. Raising it buys nothing
# the task uses and costs host disk on every parallel trial.
storage_mb = 10240

[environment.healthcheck]
# Each probe must be FAST: Harbor caps one probe at timeout_sec and does the
# waiting itself through start_period_sec + retries, so wait-for-service's own
# 600s default has to be capped or every probe blows the cap and counts failed.
#
# Gitea by name, not `--all`. These tasks need the repository and the CI
# runner; Mattermost and BookStack are empty here and waiting on them only
# adds minutes. (`--core` is AlphaShop's flag and does not exist in this
# world: `wait-for-service` here takes [--all] [--quiet] [service...], and an
# unknown name exits 1, which fails every probe.)
#
# This also carries task setup, because the healthcheck is the only hook that
# runs as root before the agent starts. task-setup.sh is idempotent.
command = "WAIT_TIMEOUT=15 wait-for-service --quiet gitea && /usr/local/bin/task-setup.sh"
start_period_sec = 600.0
start_interval_sec = 10.0
interval_sec = 15.0
# 900, not 120. Harbor caps ONE probe at this, and the probe now carries the
# plant ingestion -- a Mattermost bulk import plus BookStack pages plus mail.
# At 120 the probe is killed mid-import, the next one starts over, and the trial
# dies having never finished a single pass.
timeout_sec = 900.0
retries = 20
