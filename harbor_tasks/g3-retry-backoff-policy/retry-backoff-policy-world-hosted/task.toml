schema_version = "1.4"

[task]
name = "bespokelabs/retry-backoff-policy"
version = "1.0.0"
description = "Failure-class retry policy for online request processors. The requirements that decide correctness are not stated. The remarks they were inferred from are in the company's chat, wiki and mail, and the agent has to find them."
authors = [{ name = "SWEWorld" }]

[metadata]
author_name = "Nidhi Parthasarathy"
author_email = "nidhi@bespokelabs.ai"
author_organization = "Bespoke Labs"
category = "Software"
subcategory = "API client reliability"
tags = ["python", "retry-policy", "exponential-backoff", "rate-limiting", "asyncio", "requirements-discovery"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The ticket is a precise but deliberately incomplete change to an asynchronous LLM request client: classify every failure into one of four classes, give each class its own backoff schedule with injected clock and jitter, count each failure exactly once in the base processor, and stop three provider processors from double-counting. The requirements that decide correctness are not in it. Two further requirements, covering how much a failed attempt costs against a request's retry budget and how the rate-limit pause is represented and extended across a run, were settled in scattered remarks: chat threads, wiki page comments and mail, spread over months and mixed with earlier decisions the team later reversed. The hard part is the same for a human engineer and an agent: work out which of dozens of remarks bear on this change, tell a superseded decision from the current one, and reassemble exact names, placements, boundary conditions and rounding that no single remark states whole, while also delivering a correct multi-file change to the retry path of a concurrent request processor without breaking its existing accounting. The accompanying company data (chat, wiki, mail and issue tracker) is synthetically generated around the real open-source curator repository and its real history, written to read like an ordinary engineering organisation with realistic noise and reversals, so finding the evidence is a retrieval-and-judgement challenge rather than a puzzle. In the real world this is the work of a backend or platform engineer who owns the reliability layer of an API client library and picks up a ticket whose conventions live partly in team memory."
solution_explanation = "The reference solution (solution/oracle.patch, applied and pushed to main by solve.sh) adds a pure, standard-library-only module retry_policy.py. classify_failure walks four table-driven signals in order (HTTP status, exception type names along the MRO, message markers, then the default) and swallows any error while reading them. RetryPolicy takes the clock and jitter as constructor arguments; delay_for caps the exponential schedule before applying jitter and draws jitter only for a positive delay. decide is a pure function of the exception and the request's own counters passed in as keyword arguments, and returns a frozen verdict carrying the retry flag, class, attempt index, delay, reason code and the request's post-failure budget numbers, so the policy holds no per-request state and every decision is reproducible. A separate recorder applies a verdict to the status tracker: it increments exactly one counter and, for throttles only, reads the clock once and moves the tracker's cooldown horizon. The key insight is to separate deciding from side effects: once a failure is classified and priced in one place, the base processor's except block only appends to the request's failure log, writes the verdict's numbers back onto the request and either re-queues it or writes a GenericResponse with the formatted failure summary; the cool-down wait reads the remaining horizon; and the provider processors simply re-raise, so nothing is counted twice. The hidden requirements are carried out in the same module and dataclasses: a per-class attempt cost with a per-request allowance for rate limits, charged before the exhaustion test and clamped at zero, and a run-level cooldown horizon field on the tracker that only throttles extend and that never moves backwards, while the old fixed-pause config knob is left in place but no longer read. The patch is then committed and merged to main in Gitea, which is how code reaches the graded and deployed state in this world."
verification_explanation = "WHO GRADES WHAT. The verifier clones whatever main holds in Gitea after the agent finishes and grades it in two processes. An unprivileged worker, started from a jail holding only answer-free probe files (the tests directory is root-only), imports the submission and records raw values from fixed scenarios: counting stand-ins for the injected clock and jitter, fake status trackers, a stub processor driven through the real except block and cool-down path, and each of the three provider processors' rate-limit branches entered directly. Verdict fields and the verdict-recording method are read under several plausible spellings and either argument order, since the ticket names neither; the values themselves are still compared exactly. A root judge, which never imports agent code and runs Python in isolated mode (-I) with a root-owned HOME so nothing the worker writes can execute in it, compares those values -- and the submission's own source, parsed but never executed -- against the expected behaviour, one test per fact. FACTS AND REWARD. The two hidden requirements make nine facts: attempt cost has rule, scope, exclusions, failure behaviour and observability; the cooldown horizon has rule, scope, exclusions and observability (it declares no failure-behaviour fact). A fact passes only if all its checks pass. The open ticket -- classification tables, schedule, verdict shape and reason codes, counters, summaries, attempt labels, base-processor wiring -- is one further test, open_feature. The reward is binary: 1 only if open_feature and all nine hidden facts pass, otherwise 0, so recovering the hidden requirements without delivering the ticket scores 0. The instruction protects no whole file, so there is no protected-file term. Per-fact results and push/CI/deploy provenance sit beside the reward in reward.json and ctrf.json; provenance is informational and does not gate it. open_feature also covers three guarantees the ticket states only in prose. Classification never raises: asked about five exceptions whose status property or whose __str__ raises when read, three must still come back with the class a working signal found -- message still says 429, status still says 429, both accessors raise but the type still names a class -- so catching everything and returning the default fails. A request given up on is written out as a GenericResponse whose response_errors is the formatted failure summary and whose response_message and raw_response are None, driven through the real except block with the write-out stubbed to capture it. And the three provider processors no longer touch a tracker counter (source check five) and still raise the failure they saw, which is read by driving those branches. COMPARISONS. No approx, isclose or absolute-difference tolerance anywhere in the judge: every value check is exact equality, floats included. That is sound because every float compared is either rounded to three decimals by the ticket or the requirement (delays, remaining cooldown seconds) or an exact sum of such a delay and an integer clock reading (horizons 508.0, 516.0, 705.0, 1005.0). No wall clock is read on any graded path either, and no check compares elapsed time: the cooldown-horizon exclusions fact pins the clock the processor reads to a fixed instant (1700000000.0) before the processor is built, so an implementation that captures time.time into its policy at construction captures the frozen one, and it puts the tracker's horizon exactly 4.0 s ahead of that instant, which makes the pause 4.0 exactly with nothing to round and nothing to elapse. The checks that are not plain equality: (1) lengths and emptiness, in that same fact -- exactly one sleep for a live horizon, whose length is then compared exactly, and no sleep at all for a run never throttled or whose horizon has lapsed; (2) field placement -- throttle_cooldown_until's index among the tracker's dataclass fields must equal time_of_last_rate_limit_error's index plus one, and the only newly added pause-like field, diffed against the pristine tree the runner stages, must be that one, an unreadable pristine tree failing the fact rather than passing unchecked; (3) identity -- open_feature requires the verdict's retry flag to be exactly True or False, while the hidden facts compare that flag by equality inside a list of verdict fields; (4) exceptions -- the expected type name (ValueError, FrozenInstanceError) must appear in the raised exception's MRO; (5) containment -- APIRequest's fields include attempts_made, failure_log and throttle_waivers_left, and decide either accepts arbitrary keyword arguments or names all three counters; (6) clock and jitter call counts, compared exactly. SOURCE CHECKS, five, each read from the cloned files as a syntax tree; text is never searched, so a comment or a docstring decides nothing. One: retry_policy.py must import none of aiohttp, time or random, every module it does import must resolve to this interpreter's standard library (sys.stdlib_module_names) or to the project itself, so an undeclared third-party import such as requests fails the fact as well, and an interpreter that cannot name its own standard library fails the fact rather than skipping the check; nor may it import dynamically -- a call to __import__ or importlib.import_module, or an importlib import, fails the fact, since a dynamic import hides what it reaches for from the tree (open_feature). Two: the BaseOnlineRequestProcessor class must hold no attribute read and no exact-name string of seconds_to_pause_on_rate_limit (cooldown exclusions). Three: every APIRequest(...) construction in the base processor must pass attempts_left as a keyword whose expression reads a max_retries attribute, with the pristine tree's own seeding expression still present at one of those sites; a construction that unpacks its arguments, or a missing pristine tree, fails the fact rather than skipping the check (attempt-cost scope). Asking it per construction site is what makes it load-bearing: a pristine copy parked in a method nothing calls cannot answer for the request the processor really builds. Four: a call to format_attempt_label must appear in live code outside every except handler in base_online_request_processor.py, and the old max_retries - attempts_left arithmetic must be gone from that module (open_feature). This is the ticket's clause that the retry-loop debug line uses format_attempt_label so both log sites agree on the attempt number. Only the helper's output was graded before, so a retry-loop line still doing its own subtraction -- wrong after this change, since attempts_left no longer falls by one per failure -- could survive. Live is resolved, not assumed: the definition Python binds (module level, last def of a name wins, and a name defined twice in one namespace is refused rather than resolved, property and overload companions aside); reachable, meaning a scope something outside the module enters (a public or dunder method, which is how the framework calls in) or a definition live code mentions by name, to a fixpoint; and not in a branch a literal test closes, where if False: is one spelling among while False:, if not True:, if (): , for _ in []: and anything after a return, raise, continue or break. A value computed once in a class body or at import is not a log line and does not count. Which method holds the call is not constrained, since the instruction names none; the reference calls it from the submission loop in process_requests_from_file, whose retry loop is outside the file's single except handler, so a correct solution cannot be trapped. Five: the three provider processors (openai, anthropic, litellm online) must no longer write a tracker counter -- num_api_errors, num_other_errors, num_rate_limit_errors -- in any of these forms: an augmented, plain or annotated assignment; a write or a del through a subscript of the instance attribute map (__dict__ or vars()); a del of the attribute; a setattr or delattr call, the unbound object.__setattr__ and the bound tracker.__setattr__, whose arity tells them apart since one names the attribute second and the other first; and a bulk update of the attribute map. A name the grader cannot read -- a computed setattr name, an update whose mapping is a variable -- fails too, because a write it cannot read must not be reported as no write at all. Each module is parsed whole rather than at the ticket's line ranges, so a decrement moved into a helper in the same file is caught (open_feature). Forms outside that list do get through, and they are worth naming: an in-place or-assignment of the attribute map, the unbound dict.update(st.__dict__, ...), operator.setitem, a pop from the attribute map, setattr reached through an alias, exec of the assignment, and a write in a fourth module a provider calls into, since nothing here follows a call. On the rate-limit path the behavioural check below sees any of them anyway, because it compares the tracker's three counters across the call; what is left uncovered is a write on a provider path this grader does not drive. All are deletion-shaped -- the constraint is that lines the ticket names go away -- and a write on a path nothing drives changes no graded value and earns no score. Judged by advantage, keeping one is cosmetic. THE PROVIDER CLAUSE IS ALSO CHECKED FROM THE INSIDE. instruction.md:120-126 is one sentence with two halves -- the blocks stop mutating tracker counters, and they just re-raise -- and no source read answers the second. A provider processor cannot be constructed here (its __init__ wants an API key and a client), so the worker calls each handler directly with a stand-in self carrying the attributes it reads and with the one call that would reach the network replaced: openai's fetch_response returning a rate-limit error body, a fake aiohttp session for anthropic, and litellm's acompletion raising litellm's own RateLimitError. Per provider the judge requires that the branch could be driven at all -- one the worker could not enter fails the fact with the error it reported, rather than passing -- that something propagated out of it instead of the handler returning, and that the tracker's three counters are unchanged across the call. For litellm, whose block is the one that CATCHES the provider's own exception, it also requires that the object which came out is the one raised underneath, which is what raise e preserves; openai's and anthropic's blocks build their own Exception(\"API error: ...\") in the pristine tree too, so the most the ticket says about them is that they still raise. THE SEEDING CLAUSE IS ALSO CHECKED BEHAVIOURALLY. The worker builds a processor configured with max_retries = 9 and runs the processor's own submission loop over a one-line request file, with the module's APIRequest replaced by a recorder that captures the keyword and stops at the first construction; the judge requires exactly 9, and an unobserved construction fails the fact with the error the worker reported. It catches a seeding that reads max_retries and still produces something else -- min(3, self.config.max_retries) is the control -- which no source reading can distinguish; every other request in the suite is built by the probe itself, which is why this site had no behavioural coverage before. CALIBRATION, measured on the real probe and judge because floats are compared exactly: the reference patch, alternative correct implementations, and wrong controls each violating one rule. The reference scored 10/10 in every run, including three fresh-seed runs of this round's checks and one with four spinners saturating the box -- the machine-load control for the frozen-clock pause -- and two runs with the same seed produced byte-identical observations and junit. Two alternative correct implementations also scored 10/10: one grows the delay iteratively with the cap applied at each step, jitters as raw * 0.5 * (1 + j), rounds after clamping the remaining cooldown at zero and moves the horizon with an if-greater assignment; the other uses pow(), jitters as raw/2 + raw*j/2, rounds with decimal quantize and swaps the max() arguments. Every control failed only the facts its defect belongs to. Jitter before the cap failed open_feature (a schedule ending 40.0, 60.0, 20.0 against 37.5, 37.5, 12.5); a plain horizon assignment failed the horizon rule and observability facts (504.0 against 508.0, 1001.0 against 1005.0); an unrounded remaining cooldown failed the horizon rule fact (8.0009 against 8.001). These failed open_feature alone: a classifier reading the status and message accessors unguarded; one wrapping all three signals in a single try returning the default; a give-up path writing raw error strings instead of the formatted summary; a provider keeping its compensating num_api_errors decrement, as a plain assignment, then a setattr, then object.__setattr__; reaching time through importlib.import_module; and, for source check four, reverting the retry-loop log line to its own max_retries-minus-attempts_left arithmetic with the except-block call left alone, then parking the module's only call to format_attempt_label in an if False: branch, in a method nothing references, and behind a duplicate def. These failed the attempt-cost scope fact alone: seeding the production APIRequest from a literal, and from min(3, self.config.max_retries), each with a pristine copy of the expression parked in an unreachable method -- the second passes every source check and fails on the behavioural observation, 3 against 9. This round's four new controls each failed open_feature alone: retry_policy.py importing requests (third-party, so the allowlist rejects it, while the module still imports and every other fact passes); openai's rate-limit branch returning instead of raising; litellm's except block raising a RuntimeError in place of the exception it caught; and the same block dropping it. Both alternative correct implementations scored 10/10 again against the frozen-clock check."

[agent]
# The world's engineer: uid 1000, no sudo, cannot reach supervisord, cannot read
# /opt/world-state or the deploy queue.
user = "ubuntu"
# 7200, not 3600. At an hour every g11 trial was still pushing, polling CI and
# re-running tests in its last minutes, so the cutoff -- not the hidden
# requirements -- was deciding how much got checked. The difficulty is meant to
# be finding what nobody wrote down, not racing the clock.
timeout_sec = 7200.0

[verifier]
# Root, because grading reads the pristine tree at /opt/world-state/input/curator
# (to tell an agent's new identifiers from curator's own) and the release
# symlinks under /opt/sweworld/curator, neither of which the agent can touch —
# so the state being graded cannot be forged.
user = "root"
# 2400, not 1800. Horizon's own lint rejects anything under 2000s, and the reason
# is worth keeping: a grader that overruns is KILLED, and a killed grader scores
# zero — so a perfect solution and a broken one produce the same result and
# nothing in the output says which happened.
timeout_sec = 2400.0

[environment]
# NO docker_image and NO docker-compose.yaml. One thin layer on the world image,
# booting supervisord through ENTRYPOINT (environment/task-entrypoint.sh).
# Harbor's compose template appends `command: ["sh","-c","sleep infinity"]`, and
# Compose's `command:` overrides CMD rather than ENTRYPOINT, so with a compose
# file those args reach supervisord as argv and the world never boots.
build_timeout_sec = 3600.0
# claude-code installs itself from downloads.claude.ai and calls the API.
# `allow_internet`, not `network_mode`: the benchmark's task.toml schema names
# only this one, and Harbor's default network mode is already public.
allow_internet = true
cpus = 2
memory_mb = 13000

[environment.healthcheck]
# Each probe must be FAST: Harbor caps one probe at timeout_sec and does the
# waiting itself through start_period_sec + retries, so wait-for-service's own
# 600s default has to be capped or every probe blows the cap and counts failed.
#
# Gitea by name, not `--all`. These tasks need the repository and the CI
# runner; Mattermost and BookStack are empty here and waiting on them only
# adds minutes. (`--core` is AlphaShop's flag and does not exist in this
# world: `wait-for-service` here takes [--all] [--quiet] [service...], and an
# unknown name exits 1, which fails every probe.)
#
# This also carries task setup, because the healthcheck is the only hook that
# runs as root before the agent starts. task-setup.sh is idempotent.
command = "WAIT_TIMEOUT=15 wait-for-service --quiet gitea && /usr/local/bin/task-setup.sh"
start_period_sec = 600.0
start_interval_sec = 10.0
interval_sec = 15.0
# 900, not 120. Harbor caps ONE probe at this, and the probe now carries the
# plant ingestion -- a Mattermost bulk import plus BookStack pages plus mail.
# At 120 the probe is killed mid-import, the next one starts over, and the trial
# dies having never finished a single pass.
timeout_sec = 900.0
retries = 20
