schema_version = "1.4"

[task]
name = "bespokelabs/run-cache-identity"
version = "1.0.0"
description = "Versioned run identity for the curator cache. The requirements that decide correctness are not stated. The remarks they were inferred from are in the company's chat, wiki and mail, and the agent has to find them."
authors = [{ name = "SWEWorld" }]

[metadata]
author_name = "Nidhi Parthasarathy"
author_email = "nidhi@bespokelabs.ai"
author_organization = "Bespoke Labs"
category = "Software"
subcategory = "Caching and cache invalidation"
tags = ["python", "cache-identity", "content-hashing", "cache-invalidation", "sqlite-migration", "requirements-discovery"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The ticket replaces an ad-hoc cache fingerprint in an LLM inference library with a versioned run identity: a hashed set of components, a stamp file each cache directory carries, reconciliation of old, foreign and newer directories, a forward schema migration of the run metadata database and a check that a cached response still describes the dataset it is loaded with. It is precise about the new API but deliberately silent on two things that decide correctness: exactly what a run's identity is computed from, including which backend settings count as the same run and which must never reach a file on disk, and how a run with caching disabled is identified so it can be found and replayed. Those were settled in scattered remarks (chat threads, wiki pages, mail and code review) spread over months and mixed with earlier decisions the team later reversed. The hard part is the same for a human engineer and an agent: work out which of dozens of remarks bear on this change, tell a superseded decision from the current one, and reassemble exact names, key sets and refusal behaviour that no single remark states whole, while also delivering a correct change across the LLM entry point, the metadata database, the cached-response loader and the request processor without breaking existing caches. The accompanying company data (chat, wiki, mail and issue tracker) is synthetically generated around the real open-source curator repository and its real history, written to read like an ordinary engineering organisation with realistic noise and reversals. In the real world this is the work of a library or platform engineer changing a cache key in a codebase whose conventions live partly in team memory, where a wrong key either silently serves stale results or throws away every cache on a credential rotation."
solution_explanation = "The reference solution (solution/oracle.patch, applied and pushed to main by solve.sh) adds a top-level module run_identity.py that owns everything about identity and is free of ambient state: it never reads the clock, the environment or a random source, so every timestamp and every cache-disabled run id is passed in. It builds the components by duck typing on the LLM object (backend and parameters, prompt and parse function hashes via the moved _get_function_hash, model, generation parameters, system prompt, response schema, batch mode, completions flag, dataset hash and run id), filters backend parameters through an allowlist so retry, timeout and credential knobs neither fork the cache nor reach the stamp, hashes a version-prefixed, key-sorted JSON payload with xxh64, and names the directory v3-<digest> or v3-nocache-<digest>. write/read/reconcile functions implement the stamp file and the created/adopted/upgraded/matched states, refusing a disagreeing or newer stamp without deleting anything. The key insight is that identity is a contract about what changes the output, not a hash of everything the caller passed: the backend is the resolved one, and a cache-disabled run is identified by a caller-supplied id (defaulted in LLM.__call__ from CURATOR_RUN_ID or a fresh uuid4) and refused before any directory is made when the id and the cache setting disagree. llm.py exposes backend/backend_params, computes and reconciles the identity before using the directory and lets identity errors escape the cache lookup; db.py migrates missing columns forward and records parse_func and identity_version; CuratorResponse carries run_identity and verifies the dataset it is loaded with; the request processor clears its cached-dataset flag at the start of run(). The change is then committed and merged to main in Gitea, which is how code reaches the graded and deployed state in this world."
verification_explanation = "The verifier clones whatever main holds in Gitea after the agent finishes and grades that. A worker process, running as nobody from a jail that holds only the probe, its support code, the fixture derivation and the shared harness shim, imports the submission and runs scenarios drawn from a fresh random seed each run: model, dataset hash, generation parameters, system prompt, a generated response model, prompt and parse functions, backend-knob values and combinations, run ids and rows all change per run, so values captured from an earlier run cannot be replayed. No answer is in that jail, and no answer's name either: where a fact turns on a constant the hidden requirement invents, the probe reports every string constant the package exports, under the module's own names, and the judge \u2014 which owns the names \u2014 picks out the ones it is looking for. It records what it observed and leaves the stamp files and cache directories the submission wrote under an artifacts root. The seed each run drew is written into the run report, so a run can be re-derived exactly; the inputs move but the reward does not, because nothing is compared against a stored value. The fixture derivation asserts the properties its facts assume before handing the draw over (the two model names differ, the two dataset hashes differ, no two run ids collide, the rotated knobs really moved, no response-model field shadows a pydantic attribute) and raises on a degenerate draw rather than letting a fact fail for the wrong reason. Measured on this version through the real probe and the real judge: the reference solution scores 1 on fresh random seeds; seven correct implementations score 1 \u2014 xxh64 held in a `functools.partial` and in a `__slots__` holder, which are the two that scored 0 on the previous version because the reference they captured sat in a C-level slot no walk could reach, and xxh64 reached through a property, through a local import inside the function, through a base-class attribute a subclass overrides, through a module-level name rebound after import, and by a correct module whose docstring quotes the instruction's own words about random, secrets and uuid; the module-level dict entry, class attribute, instance attribute and default-argument routes, and the imported alias and the unrelated use of hashlib, binascii and zlib, were measured at 1 on the previous version and now take the wrapper by the same rule as every other import-time capture; and six deliberately wrong variants \u2014 a truncated SHA-256 digest reached through `__import__`, a hand-rolled FNV-1a digest beside an unused xxh64 call, the same payload with its version tag removed, a bespoke untagged serialisation of the components, a schema check that lets an unexpected column through, and a tree that leaves a dead verbatim copy of `_get_function_hash` behind in llm/llm.py \u2014 each fail exactly one test, the open feature, with all eight hidden facts still passing. The same seed run twice gives a byte-identical verdict and the same drawn inputs, and the observations and directories of a correct run, replayed against a different seed, score 0 on all nine tests. A separate root judge, which never imports agent code and runs Python in isolated mode (-I) with a root-owned HOME, re-derives the same fixture from the seed, works out what an identity over those inputs must carry, reads the directories and stamps itself (refusing symlinks, O_NOFOLLOW, 4 MiB cap per file), parses the submission's source with ast (the two named constants, the no-randomness rule, the declared frozenness of the three dataclasses, and `_get_function_hash` compared as an AST against the pristine copy of llm/llm.py the harness stages, that fact failing if the copy is missing, with llm/llm.py itself required to define it no longer, so a copy left behind \u2014 a dead one included \u2014 is not the move the ticket asks for), re-hashes the payload the submission fed to xxh64 with its own stdlib XXH64, and writes one test per fact. The two hidden requirements are split into eight facts: identity components (rule, scope, exclusions, observability) and cache-disabled run ids (rule, scope, failure behaviour, observability). Each fact passes only if all of its checks pass. Nothing is asserted that the ticket does not state: an unexpected database column must stay fatal, and because the ticket names no exception class and no message for that case, any exception satisfies it and the class and message are only reported; `BaseRequestProcessor.run()` must clear the cached-dataset flag as its first statement, and what a warm cache then does with that flag is curator's existing behaviour, which this ticket neither states nor changes, so it too is reported and not graded. The open ticket's behaviour (constants and exports, exception attributes, dataclass fields and declared frozenness of all three dataclasses, the recomputed digest and the v3- run hash over it, the exact stamp serialisation, the four reconcile outcomes and non-destructive refusals, the moved and re-exported _get_function_hash, the db.py migration and store_metadata results, CuratorResponse.run_identity and the fingerprint, size and columns checks in load, the cached-dataset flag and identity errors escaping the cache lookup) is graded as one further test, open_feature, by the same judge. The reward is binary: 1 only if open_feature passes and all eight hidden facts pass; otherwise 0 (this ticket protects no whole file, so there is no protected-files term to fail). A submission that recovers the hidden requirements but does not deliver the ticket therefore scores 0. Per-fact results and push/CI/deploy provenance are reported beside the reward in reward.json and ctrf.json; provenance is informational and does not gate it. Every check is exact; there are no floating-point comparisons and no tolerances. Names, key lists, component values recomputed from the seed, exception class names in the recorded MRO and their attributes, signature parameter kinds and defaults, status/version tuples, database rows and the stamp file text are compared by equality. The digest is re-derived rather than inferred from its shape. While the worker computes one extra identity, over a dataset hash drawn from the run's seed and used nowhere else, every xxh64 entry point is wrapped so that it keeps the bytes it was fed, streamed updates included. The wrapping happens on the xxhash package and on the extension module under it BEFORE the submission is imported, and that order is the whole mechanism: whatever a module body of the submission then captures IS the wrapper, so an alias, a rebound name, a dict entry, a class or instance attribute, a default argument, a functools.partial and a __slots__ holder all record, because the unwrapped object is no longer reachable by the time that code runs. Wrapping afterwards and then walking the package's objects for the reference a module had captured is what this replaced: a reference kept in a C-level slot (a partial's func, a __slots__ member descriptor) lives in no __dict__ and no walk reaches it, which is why two correct implementations scored 0 on the previous version. That walk is kept behind the early wrap, for a holder taken before it, but the measurement no longer rests on it. One limit remains, stated because it bounds what the digest check means: a submission that gets at an entry point other than through an imported xxhash module \u2014 loading the extension a second time by file path, or through ctypes \u2014 or that puts the real object back on the module itself, hashes unrecorded and would fail the digest check although it is correct; neither curator nor the reference solution does either, and the wrapping is in place before any submission code runs; the judge then hashes those bytes again with XXH64 written out in the standard library (tests/g4_run_cache_identity/xxh64_ref.py, checked against known digests before it is used and against the run's own recorded calls as it is), and requires the reported digest to BE the xxh64 of one of the payloads the module really hashed, the run hash to be v3- followed by that digest, the payload to carry every component key together with this run's seeded dataset hash and model name, and the payload to be more than the components serialised: it may equal no untagged spelling of them, and once every component key and every component value is struck out of the payload, what is left of it must name the identity version (or the version must be one of the serialised components itself). A digest from any other hash function therefore fails whatever the module's source looks like, and so does an xxh64 taken over a payload with no version tag in it, whatever spelling the serialisation uses: because the components are struck out key by key and value by value, an unrecognised, untagged rendering cannot pass on a digit that happens to sit inside one of its own values. The module source is read as well, and what that read says is reported beside the results rather than graded: it can only recognise a hasher reached through a name, and a correct module that calls its entry point through a subscript, an attribute or a parameter has no such name, so failing on it would reject exactly the implementations the capture was widened to see. What it stood in for is measured instead \u2014 a run that called no xxh64 entry point at all while computing the identity fails the digest check. Reaching for another hash library (hashlib, zlib, binascii and the like) is reported as a diagnostic beside the results and fails nothing, because the re-derivation already settles where the digest came from: a submission that hashes with one of them fails the re-hash whatever its imports look like, so failing on the import itself could only reject a correct submission that used one of those libraries for something unrelated. Run hashes that this cannot reach \u2014 the ones the hidden facts compare, computed inside the submission's own call path \u2014 are graded relationally, always beside the seeded components they came from: equal where the identity must not move (same inputs, non-identity knobs, a rotated key, auto-detected versus declared backend, a replayed run id) and different where it must (a different dataset, identity knob, component or run id). The remaining shape checks are exact as well: the digest is 16 lowercase hex characters, a cache-disabled run hash starts with v3-nocache- and is exactly 27 characters, a minted default run id is 32 lowercase hex characters and two unidentified runs get different ids, and the expected numbers of directories and processor calls are exact counts. Three limits, stated because they bound what the reward means. The worker is the process that runs agent code, so a submission that works out inside a hook what a correct implementation would have produced \u2014 from the same seeded derivation the probe uses, which has to be in the jail \u2014 passes the facts it forges; the per-run seed stops a replay of an earlier run, not a derivation at run time, and what it and the judge's own reads of the source and of the directories buy is that such a forgery must re-implement the requirement and ship a module whose source the judge reads. The version tag is tested by striking every component key and value out of the payload and requiring the version in what is left, so a payload that carries a stray '3' outside its components counts as tagged. And an infrastructure failure that leaves no junit.xml at all, such as a failed clone, scores as an agent failure rather than as an error."

[agent]
# The world's engineer: uid 1000, no sudo, cannot reach supervisord, cannot read
# /opt/world-state or the deploy queue.
user = "ubuntu"
# 7200, not 3600. At an hour every g11 trial was still pushing, polling CI and
# re-running tests in its last minutes, so the cutoff -- not the hidden
# requirements -- was deciding how much got checked. The difficulty is meant to
# be finding what nobody wrote down, not racing the clock.
timeout_sec = 7200.0

[verifier]
# Root, because grading reads the pristine tree at /opt/world-state/input/curator
# (to tell an agent's new identifiers from curator's own) and the release
# symlinks under /opt/sweworld/curator, neither of which the agent can touch —
# so the state being graded cannot be forged.
user = "root"
# 2400, not 1800. Horizon's own lint rejects anything under 2000s, and the reason
# is worth keeping: a grader that overruns is KILLED, and a killed grader scores
# zero — so a perfect solution and a broken one produce the same result and
# nothing in the output says which happened.
timeout_sec = 2400.0

[environment]
# NO docker_image and NO docker-compose.yaml. One thin layer on the world image,
# booting supervisord through ENTRYPOINT (environment/task-entrypoint.sh).
# Harbor's compose template appends `command: ["sh","-c","sleep infinity"]`, and
# Compose's `command:` overrides CMD rather than ENTRYPOINT, so with a compose
# file those args reach supervisord as argv and the world never boots.
build_timeout_sec = 3600.0
# claude-code installs itself from downloads.claude.ai and calls the API.
# `allow_internet`, not `network_mode`: the benchmark's task.toml schema names
# only this one, and Harbor's default network mode is already public.
allow_internet = true
cpus = 2
memory_mb = 13000

[environment.healthcheck]
# Each probe must be FAST: Harbor caps one probe at timeout_sec and does the
# waiting itself through start_period_sec + retries, so wait-for-service's own
# 600s default has to be capped or every probe blows the cap and counts failed.
#
# Gitea by name, not `--all`. These tasks need the repository and the CI
# runner; Mattermost and BookStack are empty here and waiting on them only
# adds minutes. (`--core` is AlphaShop's flag and does not exist in this
# world: `wait-for-service` here takes [--all] [--quiet] [service...], and an
# unknown name exits 1, which fails every probe.)
#
# This also carries task setup, because the healthcheck is the only hook that
# runs as root before the agent starts. task-setup.sh is idempotent.
command = "WAIT_TIMEOUT=15 wait-for-service --quiet gitea && /usr/local/bin/task-setup.sh"
start_period_sec = 600.0
start_interval_sec = 10.0
interval_sec = 15.0
# 900, not 120. Harbor caps ONE probe at this, and the probe now carries the
# plant ingestion -- a Mattermost bulk import plus BookStack pages plus mail.
# At 120 the probe is killed mid-import, the next one starts over, and the trial
# dies having never finished a single pass.
timeout_sec = 900.0
retries = 20
