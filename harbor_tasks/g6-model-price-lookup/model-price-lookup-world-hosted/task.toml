schema_version = "1.4"

[task]
name = "bespokelabs/model-price-lookup"
version = "1.0.0"
description = "Unified model price resolution. The requirements that decide correctness are not stated. The remarks they were inferred from are in the company's chat, wiki and mail, and the agent has to find them."
authors = [{ name = "SWEWorld" }]

[metadata]
author_name = "Nidhi Parthasarathy"
author_email = "nidhi@bespokelabs.ai"
author_organization = "Bespoke Labs"
category = "Software"
subcategory = "LLM cost accounting and pricing"
tags = ["python", "llm-pricing", "cost-calculation", "batch-inference", "litellm", "error-handling", "refactoring", "requirements-discovery"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The ticket is a precise but deliberately incomplete refactor of an LLM library's pricing code: model prices are looked up in several places with different rules (litellm's global table, per-provider external tables, ad hoc batch discounts in four cost processors and in the batch/online status trackers), and the ticket asks for one canonical resolver, one price type, one error type, one formatter and one registration path, with every caller moved onto them. The requirements that decide correctness are not in it. Two further requirements, covering how a failed lookup must be reported and which prices a batch run may discount, were settled in scattered remarks: chat threads, wiki pages and their comments, mail and code review, spread over months and mixed with an earlier approach the team later reversed. The hard part is the same for a human engineer and an agent: work out which of dozens of remarks bear on this change, tell a superseded decision from the current one, and reassemble exact names, orderings and provider-specific behaviour that no single remark states whole, while also delivering a correct multi-file change in which a discount applied in two places, or a sentinel returned where an error was due, silently produces wrong cost reports rather than a crash. The accompanying company data (chat, wiki, mail and issue tracker) is synthetically generated around the real open-source curator repository and its real history. It is written to read like an ordinary engineering organisation, with realistic noise and reversals, so finding the evidence is a realistic retrieval-and-judgement challenge rather than a puzzle. In the real world this is the work of a backend or platform engineer on an LLM-inference library who owns cost reporting and picks up a ticket whose conventions live partly in team memory."
solution_explanation = "The reference solution (solution/oracle.patch, applied and pushed by solve.sh) rebuilds src/bespokelabs/curator/cost.py around a single resolve_model_price function. It picks exactly one table: litellm's model_cost when no provider (or 'default') is named, otherwise that provider's external table. Each failure raises UnpricedModelError with a reason from a closed set, checked in a fixed order (provider, then model, then window), so a half-populated row is an error rather than a None or a free model. The result is a frozen ModelPrice with rounded per-million prices and an inferred-output flag. register_price_with_litellm and format_cost_strings become the only writer into litellm's table and the only builder of display strings, external_model_cost becomes a shim, and _get_litellm_cost_map is deleted. The key insight is that the batch discount must have exactly one owner. The cost processors gain batch_multiplier(), which returns the 0.5 factor only for a batch run on a list-priced source with no user-supplied price, and a class-level flag marks the klusterai and inference.net processors exempt because their external tables already list batch-tier prices; the old compensating 'times = 2' multiplies are removed. resolve_model_price applies the same factor only to litellm-sourced prices. The batch and online status trackers gain refresh_model_price(), which re-resolves through the same function, formats through format_cost_strings, and records the error reason instead of raising; the batch request processors' set_model_cost() (base, Azure, Mistral) calls it rather than reading litellm's table and halving inline. The patch is then committed and merged to main in Gitea, which is how code reaches the graded and deployed state in this world."
verification_explanation = "The verifier clones whatever main holds in Gitea after the agent finishes and grades that. A worker process, running unprivileged (as nobody) from a jail that holds no expected values, imports the submission, runs fixed scenarios against sandboxed copies of litellm's price table (resolving known and unknown models, providers and windows, registering and formatting prices, building status trackers, and computing processor costs with litellm's completion_cost pinned to a fixed raw figure of 4.0) and records the raw values it observed. A separate root judge, which never imports agent code, compares those values against the expected behaviour and writes one test per fact. The two hidden requirements are split into seven facts: the failure contract has rule, exclusions and observability (no scope or failure-behaviour fact), and the single-owner batch discount has rule, scope, exclusions and observability (no failure-behaviour fact). Each fact passes only if all of its checks pass. The open ticket's behaviour (ModelPrice shape and frozenness, the UnpricedModelError class and message, resolution of a known and an output-inferred price, the external_model_cost shim, deletion of _get_litellm_cost_map, register_price_with_litellm, format_cost_strings and the trackers' new fields and refresh_model_price) is graded as one further test, open_feature, run by the same judge. The reward is binary: 1 only if open_feature passes and all seven hidden facts pass; otherwise 0. A submission that recovers the hidden requirements but does not deliver the ticket therefore scores 0. Per-fact results and push/CI/deploy provenance are reported beside the reward in reward.json and ctrf.json; provenance is informational and does not gate it. The judge runs as root with Python in isolated mode (-I) and a root-owned HOME, so nothing the unprivileged worker writes can execute in it. EXACT CHECKS. Most checks are exact equality: field names, exception class chains and reason strings (including which reason wins when several things are wrong), error message text, dict keys, display strings such as '$0.045*' and '[dim]N/A[/dim]', booleans and None prices on degraded trackers, and these floats compared with ==: the resolved per-million prices 0.2/0.8 and 0.045/0.045, the per-token prices 2e-07/8e-07 and 4.5e-08 (the ticket fixes their rounding to 9 and 15 decimals), the multiplier table [0.5, 1.0, 0.5, 1.0, 1.0, 1.0], the Azure batch multiplier equal to the base one, exemption multipliers of 1.0, the litellm-sourced per-million prices 2.0 listed and 1.0/4.0 batched (planted inputs 2e-06/8e-06 per token), the DeepSeek external price 3.0 in and out of batch, external-table rows whose batched prices must equal their listed prices, every degraded cost() equal to 0.0, and the wildcard-tier price 0.045. Values are passed through JSON, whose float encoding round-trips every double exactly. FLOAT TOLERANCES. Nine comparisons use |got - expected| <= max(1e-6 * |expected|, 1e-12); all expected values are between 1.0 and 12.0, so the relative bound binds (1e-6 to 1.2e-5 absolute) and the 1e-12 floor never does. (1) Rule: each processor cost (base, Azure, klusterai; batch and not) equals 4.0 * batch_multiplier(), expected 2.0 or 4.0. (2) Rule: after replacing batch_multiplier with a stub returning 3.0, the cost equals before / factor * 3.0, expected 12.0, which proves no other factor is applied. (3) Rule: resolve_model_price(batch=True) input price equals the listed price times the live factor, expected 1.0. (4, 5) Scope: the litellm-sourced batched input and output prices equal listed times factor, expected 1.0 and 4.0. (6) Exclusions: with a user-supplied in_mtok_cost the base and Azure batch cost equals the raw 4.0. (7) Exclusions: a DeepSeek row planted in litellm's table (9e-06 per token) is discounted, batched input expected 4.5. (8, 9) Observability: the klusterai cost in and out of batch equals the raw 4.0. INEQUALITY CHECKS, which are one-sided rather than tolerances: the batch discount factor must satisfy 0 < factor < 1 (its exact value 0.5 is pinned separately by the observability multiplier table); in the substitution check the multiplier and the cost before substitution must both be non-zero; and the number of external-table rows resolved must be > 0 (every resolved price must be a real int or float, not None or a bool). CALIBRATION. Every tolerance checks a relation, not a magic number: a cost or a discounted price against the undiscounted figure times the live multiplier. The only legitimate variation between correct implementations is floating-point operation order, and the discount factor 0.5 is a power of two, so the variation is expected to be nil. This was measured, not assumed. Four correct implementations were run through the real probe and judge: the reference one; one that converts per-token prices with / 1e-6 instead of * 1e6, discounts with (1 - factor), and computes costs as raw / (1 / multiplier) or raw - raw * (1 - multiplier); one using exact rational arithmetic (fractions.Fraction) for the conversion, the discount and the costs; and one that discounts the per-token price before scaling it to per-million. All four scored 8/8, open feature and all seven facts. Each was also swept over all 3,328 positively priced rows of the installed litellm table and all 54 external-table rows, in and out of batch, plus 3,192 processor costs across 798 raw figures. They produced bit-identical prices and costs (maximum difference 0), and every batched price and cost met its judge relation with zero residual. Three deliberately wrong variants were run as controls. A resolver discount of 0.51 while batch_multiplier stays 0.5 failed the rule, scope, exclusions and observability facts of the discount requirement (1.02 against 1.0, and 4.59 against 4.5), about 2e4 times outside the bound. An Azure cost that applies the multiplier twice failed the rule fact (1.0 against 2.0). A resolver factor of 0.5000001, a 2e-7 relative error that sits inside the 1e-6 relative tolerance, passed the three tolerance-based facts but failed observability, whose exact check requires the batched litellm input price to be exactly 1.0 (it was 1.0000002). So the bounds admit every correct formulation tested, and a wrong factor fails either the tolerances or the exact checks that pin the numbers."

[agent]
# The world's engineer: uid 1000, no sudo, cannot reach supervisord, cannot read
# /opt/world-state or the deploy queue.
user = "ubuntu"
# 7200, not 3600. At an hour every trial of the sibling training-step-ledger
# task was still pushing, polling CI and re-running tests in its last minutes,
# and this task has the same clone/push/CI/deploy loop, so the cutoff -- not the
# hidden requirements -- would decide how much gets checked. The difficulty is meant to
# be finding what nobody wrote down, not racing the clock.
timeout_sec = 7200.0

[verifier]
# Root, because grading reads the pristine tree at /opt/world-state/input/curator
# (to tell an agent's new identifiers from curator's own) and the release
# symlinks under /opt/sweworld/curator, neither of which the agent can touch —
# so the state being graded cannot be forged.
user = "root"
# 2400, not 1800. Horizon's own lint rejects anything under 2000s, and the reason
# is worth keeping: a grader that overruns is KILLED, and a killed grader scores
# zero — so a perfect solution and a broken one produce the same result and
# nothing in the output says which happened.
timeout_sec = 2400.0

[environment]
# NO docker_image and NO docker-compose.yaml. One thin layer on the world image,
# booting supervisord through ENTRYPOINT (environment/task-entrypoint.sh).
# Harbor's compose template appends `command: ["sh","-c","sleep infinity"]`, and
# Compose's `command:` overrides CMD rather than ENTRYPOINT, so with a compose
# file those args reach supervisord as argv and the world never boots.
build_timeout_sec = 3600.0
# claude-code installs itself from downloads.claude.ai and calls the API.
# `allow_internet`, not `network_mode`: the benchmark's task.toml schema names
# only this one, and Harbor's default network mode is already public.
allow_internet = true
cpus = 2
memory_mb = 13000

[environment.healthcheck]
# Each probe must be FAST: Harbor caps one probe at timeout_sec and does the
# waiting itself through start_period_sec + retries, so wait-for-service's own
# 600s default has to be capped or every probe blows the cap and counts failed.
#
# Gitea by name, not `--all`. These tasks need the repository and the CI
# runner; Mattermost and BookStack are empty here and waiting on them only
# adds minutes. (`--core` is AlphaShop's flag and does not exist in this
# world: `wait-for-service` here takes [--all] [--quiet] [service...], and an
# unknown name exits 1, which fails every probe.)
#
# This also carries task setup, because the healthcheck is the only hook that
# runs as root before the agent starts. task-setup.sh is idempotent.
command = "WAIT_TIMEOUT=15 wait-for-service --quiet gitea && /usr/local/bin/task-setup.sh"
start_period_sec = 600.0
start_interval_sec = 10.0
interval_sec = 15.0
# 900, not 120. Harbor caps ONE probe at this, and the probe now carries the
# plant ingestion -- a Mattermost bulk import plus BookStack pages plus mail.
# At 120 the probe is killed mid-import, the next one starts over, and the trial
# dies having never finished a single pass.
timeout_sec = 900.0
retries = 20
