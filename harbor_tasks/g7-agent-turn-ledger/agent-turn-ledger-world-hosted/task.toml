schema_version = "1.4"

[task]
name = "bespokelabs/agent-turn-ledger"
version = "1.0.0"
description = "Durable turn ledger for multi-turn agent conversations. The requirements that decide correctness are not stated. The remarks they were inferred from are in the company's chat, wiki and mail, and the agent has to find them."
authors = [{ name = "SWEWorld" }]

[metadata]
author_name = "Nidhi Parthasarathy"
author_email = "nidhi@bespokelabs.ai"
author_organization = "Bespoke Labs"
category = "Software"
subcategory = "LLM agent runtime and state persistence"
tags = ["python", "llm-agents", "multi-turn-conversation", "durable-log", "checkpointing", "crash-resume", "asyncio", "requirements-discovery"]
expert_time_estimate_hours = 6.0
difficulty_explanation = "The ticket is a precise but deliberately incomplete redesign of curator's two-agent conversation loop: the seed becomes a logged turn, resume state is derived from the append-only log instead of a step parity, the response budget stops counting the seed, and the status tracker separates inherited work from this process's work. Getting that right already means reasoning about an async loop over buffered file writes, a ledger that has to be re-derived after every append, and resume after a crash at any point. The requirements that decide correctness are not in the ticket. Two further requirements, covering a small versioned checkpoint kept beside the log (what it records, exactly how it is spelled, when it is rewritten, and which of log and checkpoint wins when they disagree) and the default signal an agent uses to end a conversation, were settled in scattered remarks: chat threads, wiki pages and their comments, and mail, spread over months and mixed with earlier decisions the team later reversed. The hard part is the same for a human engineer and an agent: work out which of dozens of remarks bear on this change, tell a superseded decision from the current one, and reassemble exact names, spellings and edge-case behaviour that no single remark states whole, while delivering a correct multi-file change to the conversation loop. The accompanying company data (chat, wiki, mail and issue tracker) is synthetically generated around the real open-source curator repository and its real history. It is written to read like an ordinary engineering organisation, with realistic noise and reversals, so finding the evidence is a realistic retrieval-and-judgement challenge rather than a puzzle. In the real world this is the work of a backend or LLM-platform engineer making an agent runtime crash-safe in a codebase whose conventions live partly in team memory."
solution_explanation = "The reference solution (solution/oracle.patch, applied and pushed to main by solve.sh) adds a leaf module agent/turn_ledger.py that owns the conversation's durable record: the seed record builder, a log reader that skips blank lines and reports corrupt ones with their line number, an immutable TurnLedger built from the log records, and the checkpoint read/write/verify functions. The key insight is that the append-only log is the single source of truth and everything else is derived from it: the next speaker is the complement of the last entry's author, the response count is lines minus the seed, and completion is decided from the last entry alone. The processor therefore writes the seed through the existing append_response before its first request, flushes after every append, rebuilds the ledger from the records it holds in memory, rewrites the checkpoint after the seed and after every response, and on load verifies the checkpoint against the log before issuing any request: a missing, unreadable or old-version checkpoint is adopted, a matching one is verified, and a current-version one that disagrees on the response count or last author aborts the run rather than truncating the log. Agent.is_completed gets a real default, a case-sensitive suffix match on the completion token that ignores trailing whitespace and answers False for non-text replies. AgentStatusTracker gains adopt_ledger and an injectable clock so cached and fresh work are reported separately. The conversation-history transformation loses its one-message special case and lifts only the FIRST system message the prompt formatter returned to index 0, leaving any further system messages where the formatter put them in the body, and raises nothing when the formatter returned none. Nothing in llm/, request_processor/, client.py, db.py or the viewer is touched."
verification_explanation = "The verifier clones whatever main holds in Gitea after the agent finishes and grades that. Root byte-compares the 25 files the instruction says must not change (everything under src/bespokelabs/curator/llm/, src/bespokelabs/curator/request_processor/ and src/bespokelabs/curator/viewer/, plus client.py and db.py) against the pristine tree in /opt/world-state, which the agent cannot write. Because a byte comparison of named files says nothing about a file ADDED beside them, the judge also compares the membership of each of those three directories against the pristine copy it is given, ignoring __pycache__ and compiled droppings, so a new or deleted file anywhere under llm/, request_processor/ or viewer/ fails open_feature even though every protected byte still matches. Root also draws a fresh random seed for this grading run. A worker process, running as nobody from a jail that holds only the probe, its helpers and the seed-derivation module and no expected values, imports the submission and runs fixed scenarios whose inputs are re-drawn from that seed on every grading run: the two agent names (of varying width, so checkpoint byte counts move), the call on which a fake provider raises, the length and content of hand-written logs, what a planted lying checkpoint claims, and shuffled lists of candidate replies. Each scenario drives the real processor under asyncio with a duck-typed fake call_single_request and a pinned clock, in its own directory under an artifacts root, and the worker records only raw observations, never a verdict. A separate root judge, which never imports agent code, re-derives the same inputs from the seed, computes the expected answers itself, opens the scenario directories directly (refusing symlinks, opening with O_NOFOLLOW) to read the checkpoint bytes and log lines, and parses the submission's source with ast to confirm the constants TURN_LEDGER_FILENAME, TURN_LEDGER_VERSION and COMPLETION_SENTINEL are defined with the expected literal values. The judge reads the source for one more purpose: the three clauses of the ticket that preserve code INSIDE files the ticket must rewrite, which no whole-file comparison can express and no scenario can show broken. MultiTurnAgenticProcessor.append_response must be the pristine method statement for statement -- its ast.dump equal to the baseline's, so reformatting is not a change and a changed record format is. No module of the package may bind the name _hash_fingerprint where the pristine tree does not -- a def, an assignment to the bare name or to an attribute of it, a setattr or a namespace subscript all count -- and in the two MultiTurnAgents methods that derive the xxh64(seed_message) run identity and then consume it, the identity itself must be the pristine code: in __call__, every statement that binds fingerprint, disable_cache or working_dir (the three-part derivation, the xxh64 of the seed message in the middle of it, and the os.path.join that names the run's working directory after the fingerprint) compared as syntax trees in source order, with nothing else in the method binding those names, and in both __call__ and _setup_metadata the run_hash and dataset_hash entries the metadata reports it under, plus _setup_metadata's parameter names. That is the identity, not the whole method: an added log line or an unrelated extra metadata key changes neither the identity nor the directory and passes, while a changed, redirected or bypassed identity statement fails -- a submission that keeps the three pristine fingerprint statements and drops the fingerprint from the working-directory join would orphan every cache directory the company already has, and no scenario can see it because each one hands the processor its own directory. No dependency may be added: the dependency names in each pyproject.toml table, the build-system requires and the python = \"^3.10\" floor must equal the pristine manifest's, and no module under src/bespokelabs/curator/ may import a top-level package outside the standard library, the four the ticket names as already present (pydantic, datasets, aiofiles, aiohttp) and everything the pristine library already imports; the new agent/turn_ledger.py must also import neither time, random nor uuid and never reach for os.urandom, which is what makes every timestamp it stamps a parameter. The pristine side comes from a root-owned copy of the shipped library that the worker cannot write and, for the manifest, from the same pristine checkout the protected-file comparison reads; each check fails the open_feature fact when either is absent rather than passing unchecked. None of the three greps the submission for a keyword: the first two compare syntax trees against the pristine ones, and they refuse every tree in which the definition Python ends up with is not the one they read, because the binding that runs last is the one that counts. A class of that name found anywhere in the module rather than only among its top-level statements; more than one of them; one defined inside a conditional, a loop or a try at module level; one carrying a class decorator, which is handed the class and can replace any method on it; the class name reassigned or rebound through a namespace subscript such as globals(); the method defined twice in one class body, or defined or assigned under a conditional or a loop inside it; and, anywhere in the package, an assignment whose attribute is append_response, __call__, _setup_metadata or _hash_fingerprint, whatever expression that attribute is taken from, or a setattr call whose name argument is one of those four or is not a plain string literal -- each of those is refused rather than resolved, because a computed receiver or a computed name cannot be resolved statically, and the pristine library contains neither shape: no assignment to any of those four attributes and no setattr call at all. The third compares declared and imported package names against the pristine manifest and the pristine library's own imports. Every agent-influenced path the judge reads -- the worker's observations file, the scenario directories and the cloned submission's source -- goes through one hardened reader that refuses a symlink at any component of the path, refuses anything that is not a regular file, refuses a file over its size cap, and raises rather than returning empty, so a file this judge will not read fails the fact instead of passing it blind. The judge runs as root with Python in isolated mode (-I) and a root-owned HOME, so nothing the unprivileged worker writes can execute in it. The two hidden requirements are split into eight facts: rule, scope, failure behaviour and observability for each (neither requirement has an exclusions fact). Each fact passes only if all of its checks pass. The open ticket's behaviour (seed logged as a real turn, call order and task ids, response budget, ledger fields, tracker counters, dataset rows, resume without re-generation, and the conversation-history transformation) is graded as one further test, open_feature, by the same judge. One scenario there gives an agent a prompt formatter that answers with three system messages, which a stock formatter cannot produce, and the judge rebuilds the messages that call should have been given from what that formatter actually answered and from the log's own authors and contents: the first system message at index 0, the other two still in the body. Nothing about that scenario is a literal in the judge. The reward is binary: 1 only if open_feature passes, all eight hidden facts pass, and all 25 protected files are byte-identical to the pristine tree; otherwise 0. The open ticket's half of that is decided the same way as the hidden facts: from the scenario directories the run left behind and from expectations re-derived from this run's seed, together with the ticket's preservation clauses read out of the submission's source. Per-fact results, the protected-file comparison and push/CI/deploy provenance are reported beside the reward in reward.json and ctrf.json; provenance is informational and does not gate it. EVERY CHECK IS EXACT. There are no floating-point tolerances anywhere in the judge or the probe: no approx, isclose or abs-based comparison. Values are compared with ==: agent names and call order, task ids, line and row counts, ledger and tracker integers, status and completion-reason strings, the seed record's fields (its cost must equal 0.0 exactly and its timestamps must equal the pinned clock's ISO string), the TurnLedgerDesyncError attributes and its full message string, and the result of Agent.is_completed on each rendered candidate reply, which must be the object True or False. The checkpoint is compared byte for byte against json.dumps(state, indent=2, sort_keys=True) plus a trailing newline, together with its length in bytes, at the first write and the last write. A load must leave the scenario directory's listing and the log's bytes exactly as they were. The only non-equality conditions are guards, not tolerances: write_sidecar must return an absolute path that resolves to the checkpoint in the scenario directory; a scenario file larger than 4 MB is refused and fails its fact; and a constant assigned by a non-literal expression is accepted at the source level and graded by the value the running module reports. Because every comparison is exact and no expected value is a measured float, no tolerance calibration applies."

[agent]
# The world's engineer: uid 1000, no sudo, cannot reach supervisord, cannot read
# /opt/world-state or the deploy queue.
user = "ubuntu"
# 7200, not 3600. At an hour every g11 trial was still pushing, polling CI and
# re-running tests in its last minutes, so the cutoff -- not the hidden
# requirements -- was deciding how much got checked. The difficulty is meant to
# be finding what nobody wrote down, not racing the clock.
timeout_sec = 7200.0

[verifier]
# Root, because grading reads the pristine tree at /opt/world-state/input/curator
# (to tell an agent's new identifiers from curator's own) and the release
# symlinks under /opt/sweworld/curator, neither of which the agent can touch —
# so the state being graded cannot be forged.
user = "root"
# 2400, not 1800. Horizon's own lint rejects anything under 2000s, and the reason
# is worth keeping: a grader that overruns is KILLED, and a killed grader scores
# zero — so a perfect solution and a broken one produce the same result and
# nothing in the output says which happened.
timeout_sec = 2400.0

[environment]
# NO docker_image and NO docker-compose.yaml. One thin layer on the world image,
# booting supervisord through ENTRYPOINT (environment/task-entrypoint.sh).
# Harbor's compose template appends `command: ["sh","-c","sleep infinity"]`, and
# Compose's `command:` overrides CMD rather than ENTRYPOINT, so with a compose
# file those args reach supervisord as argv and the world never boots.
#
# The build is one COPY of this task's plant plus an apt layer on an already
# published ~7 GB world image; 3600 covers pulling that base through Horizon's
# registry cache on a cold worker, which is the whole of the time.
build_timeout_sec = 3600.0
# claude-code installs itself from downloads.claude.ai and calls the API.
# `allow_internet`, not `network_mode`: the benchmark's task.toml schema names
# only this one, and Harbor's default network mode is already public.
allow_internet = true
# EIGHT, and the eval must be submitted with `--machine-type e2-custom-8-16384`.
# Nothing here is compute-bound: the grading scenarios are fakes in a tmp dir and
# take seconds. The cores go on the WORLD the agent has to work in — postgres,
# mariadb, mattermost, bookstack, gitea and its CI runner, maddy and nginx all
# run inside this one container, and CI has to build and test curator on top.
# 0e81bc4 raised this arm from 2 to 8 and missed two siblings; one of those then
# ran the same world on two cores and came back "Harbor trial did not complete",
# with its agent logging git HEAD flipping between three commits and /tmp files
# vanishing. Docker REFUSES a `cpus` above the host count rather than capping it,
# so without that --machine-type flag every rollout errors at
# `docker compose up` with zero spend. 13000 MB is what those services plus a
# curator test run need; see build_tasks.py, which resets both on a rebuild.
cpus = 8
memory_mb = 13000

[environment.healthcheck]
# Each probe must be FAST: Harbor caps one probe at timeout_sec and does the
# waiting itself through start_period_sec + retries, so wait-for-service's own
# 600s default has to be capped or every probe blows the cap and counts failed.
#
# Gitea by name, not `--all`. These tasks need the repository and the CI
# runner; Mattermost and BookStack are empty here and waiting on them only
# adds minutes. (`--core` is AlphaShop's flag and does not exist in this
# world: `wait-for-service` here takes [--all] [--quiet] [service...], and an
# unknown name exits 1, which fails every probe.)
#
# This also carries task setup, because the healthcheck is the only hook that
# runs as root before the agent starts. task-setup.sh is idempotent.
command = "WAIT_TIMEOUT=15 wait-for-service --quiet gitea && /usr/local/bin/task-setup.sh"
start_period_sec = 600.0
start_interval_sec = 10.0
interval_sec = 15.0
# 900, not 120. Harbor caps ONE probe at this, and the probe now carries the
# plant ingestion -- a Mattermost bulk import plus BookStack pages plus mail.
# At 120 the probe is killed mid-import, the next one starts over, and the trial
# dies having never finished a single pass.
timeout_sec = 900.0
retries = 20
