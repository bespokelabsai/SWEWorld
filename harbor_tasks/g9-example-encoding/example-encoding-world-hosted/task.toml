schema_version = "1.4"

[task]
name = "bespokelabs/example-encoding"
version = "1.0.0"
description = "One encoding policy for chat examples. The requirements that decide correctness are not stated. The remarks they were inferred from are in the company's chat, wiki and mail, and the agent has to find them."
authors = [{ name = "SWEWorld" }]

[metadata]
author_name = "Nidhi Parthasarathy"
author_email = "nidhi@bespokelabs.ai"
author_organization = "Bespoke Labs"
category = "ML"
subcategory = "ML infrastructure"
tags = ["python", "fine-tuning", "tokenization", "loss-masking", "sequence-windowing", "chat-templates", "requirements-discovery"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The ticket is a precise but deliberately incomplete change to how curator turns chat conversations into fine-tuning examples: one role-sequence validation shared by the tinker and Fireworks formatters, token sequences windowed from the left so the final completion survives, and per-example encoding metadata. The requirements that decide correctness are not in it. Two further requirements, covering how loss weights, refusals and the upload size budget behave when an example does not fit, and what a batch call reports about the examples it threw away, were settled in scattered remarks: chat threads, wiki pages and their comments, and mail, spread over months and mixed with earlier decisions the team later reversed. The hard part is the same for a human engineer and an agent: work out which of dozens of remarks bear on this change, tell a superseded decision from the current one (one wiki page still describes the earlier policy), and reassemble exact names, constants, field orders and edge-case behaviour that no single remark states whole, while also getting token-boundary arithmetic right: the causal shift, half-open assistant spans computed over the untruncated sequence, and a window that can cut a turn in half. The accompanying company data (chat, wiki, mail and issue tracker) is synthetically generated around the real open-source curator repository and its real history. It is written to read like an ordinary engineering organisation, with realistic noise and reversals, so finding the evidence is a realistic retrieval-and-judgement challenge rather than a puzzle. In the real world this is the work of an ML-platform engineer who owns a fine-tuning data pipeline and picks up a ticket whose conventions live partly in team memory."
solution_explanation = "The reference solution (solution/oracle.patch, applied and pushed to main by solve.sh) adds a dependency-free module finetune/encoding.py holding the role validation, the error types, the retained-prompt minimum, the Fireworks bytes-per-token constant and a frozen EncodingReport record, and re-exports them from finetune/__init__.py. DataFormatter.to_tinker_datum validates roles first, checks the tokenizer has a chat template, encodes the full chat text in one call, computes every assistant turn's half-open token span over that untruncated sequence (prefix tokenization with a tokenizer, character offsets divided by four without one), and only then takes the last max_seq_length tokens. The key insight is to decide everything on the full sequence and slice once: weights are built at full length and cut with the same window_start as the tokens, so the completion at the end always survives, a turn that starts before the window can be recognised and given no weight, and an example that would keep too little prompt can be refused before anything is emitted. format_batch absorbs only that over-length refusal as a recorded drop, lets role and tokenizer errors abort, and replaces self.last_report only when the pass completes. On the Fireworks side, from_config carries max_context_length into the formatter and to_jsonl_lines validates roles and keeps or drops whole JSON lines by their UTF-8 byte length rather than truncating them; fireworks_trainer.py builds its formatter through from_config. Pushing to main in Gitea is how code reaches the graded and deployed state in this world."
verification_explanation = "The verifier clones whatever main holds in Gitea after the agent finishes and grades that. Grading is split across two processes. A worker, running unprivileged (nobody) from a jail that holds no expected value, imports the submission, drives it through in-process scenarios and records the raw values it observed; a separate root judge, which never imports agent code and whose files the worker cannot open (/tests is root-only for the whole of grading), turns those values into the verdict and writes one test per fact. The judge runs with Python in isolated mode (-I) and a root-owned HOME, so nothing the worker writes can execute in it. THE SCENARIOS ARE DRAWN PER RUN. Root generates a random seed and hands it to both processes. fixture_spec.derive(seed) builds that run's inputs - the four-message conversation and its content lengths, three windows placed relative to the assistant turns (one whose boundary falls inside the first turn, one that starts in the prompt, one that leaves almost no prompt), an over-long example, two tokenizer-free examples (one under a budget far wider than its conversation, one under a budget narrower than it so that the window really bites), five malformed role sequences, a dense ladder of Fireworks examples whose serialized lines cover a band of UTF-8 byte lengths including multi-byte content, and a shuffled batch of rows that fit and rows that cannot - and the judge recomputes, from the same seed, what a correct implementation must have produced for those inputs: the rendered chat text, the token sequence, every assistant span, the window, the loss weights and their count, the refusals and their messages, which serialized lines survive the byte budget, and the batch report. There is therefore no fixed expected value for a submission to emit: the file the worker writes is compared against arithmetic done after the fact in a process it cannot reach. Measured: a pristine tree that implements nothing, plus an import-time payload that emits the observations captured from a correct run, scores 5 of 8 when replayed under the very seed it was captured with - the three source-declaration checks below catch it - and 0 of 8 under a fresh seed, which is the only case that can occur. WHAT IS READ FROM SOURCE. Four things behaviour cannot show are checked by the judge against the pristine curator tree, which the agent cannot write: the functions the ticket reuses unchanged (format_chat_messages, format_example, example_to_dict, write_jsonl) are compared as position-free syntax trees with docstrings ignored, so formatting and comments are free but a changed statement, a renamed parameter or a dropped decorator is not; the `if TINKER_AVAILABLE` Datum construction the ticket puts out of scope is compared the same way (tinker is not installed in this world, so that branch is unreachable at runtime); the repository's own tests/finetune/test_data_formatter.py must still contain every test it had, unchanged, which is what 'additions only' means; and fireworks_trainer.py:126, the one line of the ticket that is a WIRING, must assign self.data_formatter through a from_config(...) call and may no longer build it by calling the formatter class - asked of the code the trainer RUNS, because text alone was not enough: that line under `if False:`, or parked after a return in a function nothing calls, beside a live assignment taken from a helper that called the class, scored all eight facts while the trainer wired nothing, and it was reward-bearing, since with no such line at all the same tree fails this fact. So the assignment has to be reachable - the definition the module binds, entered from a public or dunder definition or from something live code CALLS - a mention is not a call, and entering a private method that live code merely named (self._wire_ref = self._wire) let its assignment count for all eight facts while that method never ran - and not inside a branch a literal test closes nor after a return, raise, continue or break - and it is then followed through the helpers it calls, so factoring the construction out is neither punished nor a hiding place; the line the ticket replaces is refused wherever it sits, live or dead - the requirement no scenario can reach, because constructing a FireworksTrainer wants a live Fireworks account, and the one whose absence leaves config.max_context_length reaching nothing but the SFT job kwargs while from_config itself grades perfectly. The pristine trainer is read first to confirm it still builds the formatter the old way, so that check cannot go stale either. One preservation rule has no pristine twin to compare against, because it lives inside the very function the ticket rewrites: the prefix-tokenization boundary trick that locates each assistant turn, the chat template rendered with add_generation_prompt=True up to the turn for its start index and rendered through the turn without one for its end. That one is enforced as a mechanism, from both sides. In the SOURCE, the method the ticket puts in place of _compute_weights must exist with the parameters the ticket names and must still make both of those calls with those literal flags - in itself or in a helper it calls, followed to any depth, so a submission is free to factor them out - measured, because at one level deep a correct implementation that factored the trick into a helper that called a second helper scored nothing - and the pristine function is read first to confirm it really made both, so the check cannot silently go stale. In BEHAVIOUR, the worker records every call the chat-template double received, and the judge requires, for every assistant turn of this run's conversation, that the conversation up to the turn was rendered with a generation prompt and through the turn without one, and that both renderings were then handed to encode. The worker then runs the same conversation through a second double whose encode returns TWO ids per character, so that a character offset into the rendered text is not a token index, and the judge recomputes the spans, the weights and the supervised count for that geometry. The second half is what the first cannot do: spans read straight off this double's character offsets are exactly as correct here and wrong for every real tokenizer, and calls that exist only in dead code, or on a method that has been rebound at import time, never actually happen. That last double is what closes the one bypass the call check alone could not: an implementation that made both calls, handed both renders to encode, DISCARDED the returned ids and used len(text) as the index satisfied every other check and scored all eight facts, because under a one-id-per-character double the two numbers are the same. Under the dense double they differ by a factor of two, and it fails. Measured, each of these fails open_feature and nothing else: computing the same spans from the template's character offsets, rendering the template both ways but taking the character length instead of tokenizing it, parking the two calls in an `if False` block, shadowing the declared method with tailored arithmetic, and the discarded-ids implementation just described. The judge also reads the pushed finetune package to confirm that FIREWORKS_BYTES_PER_TOKEN is declared with the required value and that EncodingReport is declared frozen with the five fields in order and their defaults, rather than trusting the worker's word for either. If the pristine tree is not readable, those checks FAIL their fact instead of passing unchecked. WHAT THE SOURCE LAYER CANNOT DO, stated rather than left to be found: these checks read declarations and preserved code, so a tree that carries the right declarations and never executes them satisfies them - measured, a pristine library plus about twenty-five lines of never-executed declarations satisfies every one. What such a tree cannot do is produce this run's observations, because the policy is nowhere it can read: /tests is root-only for the whole of grading, the worker's jail holds four answer-free files and fixture_spec carries inputs only. A forger has to implement the policy in its own payload, which is the work this task measures, and the replay figures above are what skipping it costs. The one check where an unreachable declaration was enough on its own was the trainer wiring, which is why that one now reads only the code the trainer runs. THE FACTS. The two hidden requirements are split into seven: the windowing requirement has rule, scope, exclusions and failure behaviour; the reporting requirement has rule, scope and failure behaviour. Neither declares an observability fact, and the exact values are checked inside the fact they belong to. The open ticket's behaviour - the exports, ALLOWED_ROLES being a frozenset and not merely a collection of those three strings, the five role-validation cases and their messages, the role check happening FIRST - observable because a malformed sequence handed to a tokenizer with no chat template must report the roles and not the tokenizer - the role validation to_jsonl_lines does before it serializes anything, one encode call with add_special_tokens=False and no truncation, the left window, the envelope metadata on both branches, the chat-template capability error, a tokenizer whose apply_chat_template or encode RAISES reaching the caller unchanged rather than falling back to all-ones weights, FireworksDataFormatter.from_config, the trainer wiring and the preservation rules above - is graded as one further test, open_feature, by the same judge. Each fact passes only if all of its checks pass, giving eight judge tests in all. The reward is binary: 1 only if open_feature passes and all seven hidden facts pass; otherwise 0. A submission that recovers the hidden requirements but does not deliver the ticket therefore scores 0. The instruction protects no whole FILE, so tests/task.json declares no protected_files and no protected-file check applies; its 'unchanged' statements are all about code inside files the ticket itself edits, which is why the judge enforces them from source as described above. The facts are also kept separate: the report's supervised_tokens is checked against what the kept data themselves reported rather than against the judge's own arithmetic, so one wrong weight policy fails the windowing rule and not the reporting rule as well. Push, CI and deploy provenance are reported beside the reward in reward.json and ctrf.json; provenance is informational and does not gate it. EVERY CHECK IS EXACT. There is no float tolerance anywhere in the judge: no approx, no isclose, no absolute-difference comparison, no rounding. The only floats are loss weights, which are 0.0 or 1.0 by construction; they are compared as whole lists against the recomputed list, and the judge additionally requires them to be Python floats. Everything else is exact equality on integers, strings, lists and exception attributes: token ids, window_start, token_count, supervised token counts, full error messages, the (reason, position) pairs, the surviving JSONL lines and their byte lengths, report field names in order, defaults and counters. The checks that are not plain equality are these, and they are one-sided by design rather than tolerances: an exception check requires the expected class name to appear in the raised exception's MRO, so a subclass is accepted, and the base-class checks likewise require ValueError or EncodingError in the MRO, while the two propagation checks additionally require EncodingError NOT to be in it; no encode call may carry a truncation or max_length keyword, and the calls that encode the whole chat text must pass add_special_tokens=False (other keywords are not inspected); several values must be identical to True or False, or None, rather than merely truthy; ALLOWED_ROLES must be an instance of frozenset; the trainer check requires at least one LIVE assignment of self.data_formatter to go through a call named from_config with at least one argument, counting every spelling that stores that attribute - the plain assignment, setattr(self, 'data_formatter', ...) and self.__dict__['data_formatter'] = ... - because the conforming line followed by a rebind in either of the other two scored all eight facts - resolving a call to one of the module's own definitions to whatever that definition returns - and no such assignment anywhere, live or dead, to build the formatter by calling its class, without pinning the receiver, so aliasing and subclassing stay free; the whole chat text must have been encoded at least once as one call; and the source comparisons above are syntax-tree equality after docstring removal. A handful of further assertions check the DRAW rather than the submission - that this run's window really does cut the first assistant turn in half, that one serialized line lands exactly on the byte budget and one has more bytes than characters across it, that the batch has something to keep and something to drop, that the five role sequences are five different reasons, that the wide window drawn for the dense double really does leave the whole conversation unwindowed, and that the windowed tokenizer-free example really does window, is still encodable, supervises part of its sequence and has its boundary in the prompt ahead of the first assistant turn, so that one wrong weight policy cannot fail two facts - so a degenerate seed fails loudly instead of grading nothing. Those invariants are also evaluated once, before anything is graded: if the draw fails one, every fact fails carrying that single message about the draw, so a pathological seed cannot be mistaken for a defect in the submission. DETERMINISM, AND WHY A FIXTURE THAT MOVES IS STILL A REPRODUCIBLE VERIFIER. The inputs vary from run to run; the verdict does not, and the verdict is what a grading run produces. The seed is the only source of variation: the suite makes no network call, reads no clock, depends on no mutable service, installs nothing at verify time, runs both processes with PYTHONHASHSEED pinned, and drives only the deterministic tokenizer doubles the ticket itself specifies. Given a seed the run reproduces byte for byte - measured, the same seed twice produces an identical observations file, and the derivation twice produces an identical set of inputs. The judge then applies the same policy to whatever was drawn, so a correct implementation passes every draw and an incorrect one fails every draw. Measured: the reference solution passes all eight facts on 44 distinct random seeds - three of them driven through the shipped worker and judge inside the world image, the other forty-one through a host harness that runs the same two files against the same patch; three equally correct implementations written differently also pass all eight - a loop in place of the slice assignment with an explicit branch in place of max(0, ...), the boundary trick factored into a helper method, and the same trick factored two levels deep, into a helper that calls a second helper; twenty-three deliberately wrong variants each fail exactly one fact - clipping the straddling span instead of zeroing it, >= instead of > at the byte budget, counting characters instead of UTF-8 bytes, rewriting a function the ticket reuses, editing one of the repository's existing tests, touching the Datum branch, dropping add_special_tokens=False, leaving the report unfrozen, moving the retained-prompt floor, replacing the boundary trick with offsets tailored to the template, rendering the template without tokenizing the result, parking the two template calls in an `if False` block, shadowing the declared method at import time, rendering both prefixes and handing both to encode but slicing on the rendered length, leaving fireworks_trainer.py building its formatter by calling the class, dropping the role validation from to_jsonl_lines, swallowing an apply_chat_template failure, swallowing an encode failure, inspecting the tokenizer before validating the roles, declaring ALLOWED_ROLES as a plain set, wiring the trainer from a helper that calls the formatter class while the from_config line sits under `if False:`, the same with that line parked after a return in a function nothing calls, and windowing the tokenizer path while leaving the tokenizer-free one unwindowed - which also fails the repository's own test_max_seq_length, the test instruction.md:83 says must still pass; and a tree that implements nothing scores 0 of 8. A draw that could not grade a fact is refused rather than tolerated, by the gate described above: over 20,000 seeds it has never fired. A fixed fixture would remove the variation and buy back the forgery measured above, which is why the seed is here. Every graded behaviour is measured by executing the submission; the source comparisons add nothing the runtime already shows, except in four places where it cannot. The runtime cannot reach the Datum branch at all, because tinker is not installed. It cannot reach fireworks_trainer.py either, because building that trainer wants a live Fireworks account, which is why the wiring is read from the pushed file. It cannot tell the prefix-tokenization mechanism from arithmetic that happens to agree with it on these particular doubles, which is why that rule is read from the source, from the calls the submission made AND from a second tokenizer geometry where the arithmetic disagrees. And a constant or a declaration the worker merely reported reading - the bytes-per-token factor, the frozen EncodingReport and its field order - would otherwise be taken on trust, so those are checked both ways, at runtime by the worker and in the source by the judge."

[agent]
# The world's engineer: uid 1000, no sudo, cannot reach supervisord, cannot read
# /opt/world-state or the deploy queue.
user = "ubuntu"
# 7200, not 3600. At an hour every trial of the sibling g11 task was still
# pushing, polling CI and re-running tests in its last minutes, so the cutoff --
# not the hidden requirements -- was deciding how much got checked. The
# difficulty is meant to be finding what nobody wrote down, not racing the clock.
timeout_sec = 7200.0

[verifier]
# Root, because grading reads the pristine tree at /opt/world-state/input/curator
# — to tell an agent's new identifiers from curator's own, and to compare the
# functions this ticket says are reused unchanged against the originals — and the
# release symlinks under /opt/sweworld/curator. The agent can touch neither, so
# the state being graded cannot be forged.
user = "root"
# 2400, and deliberately NOT lower, although this suite's own work is seconds.
# Measured in the world image on the reference solution: cloning the pushed main
# and applying the change 0.4s, the unprivileged worker 2.1s (most of it importing
# curator), the root judge 0.2s.
#
# The budget is not sized to that; it is sized to what a bad submission can make
# the verifier WAIT for. provenance.py settles the deploy and then the CI verdict
# on their own clocks (SETTLE_SEC 90 + CI_SETTLE_SEC 120), and run_suites caps the
# worker at 1500s because importing the submission IS executing it: an `import`
# that never returns would otherwise run to Harbor's own cap. 90 + 120 + 1500 is
# already 1710s before the clone, the judge and score.py.
#
# It is also a floor rather than a preference: Horizon's lint rejects anything
# under 2000s, and a grader that overruns is KILLED, which scores zero — so a
# perfect solution and a broken one produce the same result, with nothing in the
# output saying which happened.
timeout_sec = 2400.0

[environment]
# NO docker_image and NO docker-compose.yaml. One thin layer on the world image,
# booting supervisord through ENTRYPOINT (environment/task-entrypoint.sh).
# Harbor's compose template appends `command: ["sh","-c","sleep infinity"]`, and
# Compose's `command:` overrides CMD rather than ENTRYPOINT, so with a compose
# file those args reach supervisord as argv and the world never boots.
build_timeout_sec = 3600.0
# claude-code installs itself from downloads.claude.ai and calls the API.
# `allow_internet`, not `network_mode`: the benchmark's task.toml schema names
# only this one, and Harbor's default network mode is already public.
allow_internet = true
# 8, not the 2 build_tasks.py generates, and hand-set on purpose: this arm is
# submitted with `evaluations submit --machine-type e2-custom-8-16384`, which is
# the only thing that gives the eval runner more than two cores. Docker REFUSES a
# `cpus` above the host count rather than capping it, so this number and that flag
# have to move together -- 8 here with a default-machine submit errors EVERY
# rollout at `docker compose up --detach --wait`, buried under a screen of BuildKit
# progress lines that reads like a build failure.
# It also puts this arm beyond `horizon tasks validate`, whose runner has 4 cores.
# A rebuild from build_tasks.py (HOSTED_CPUS = 2) silently puts it back to 2.
#
# Why a reasoning task asks for this much: the container is not only the agent's
# shell, it is the whole company. supervisord runs postgres and Mattermost,
# MariaDB with php-fpm and BookStack, Gitea with its act-runner CI, the maddy
# mail server, nginx and the deploy daemon, and the agent runs curator's pytest
# beside them. None of that is the task's difficulty -- the g9 grader itself is
# pure in-process Python -- it is the cost of the world the agent searches.
# memory_mb stays under the 16 GB of that machine type, leaving the host room.
cpus = 8
memory_mb = 13000

[environment.healthcheck]
# Each probe must be FAST: Harbor caps one probe at timeout_sec and does the
# waiting itself through start_period_sec + retries, so wait-for-service's own
# 600s default has to be capped or every probe blows the cap and counts failed.
#
# Gitea by name, not `--all`. These tasks need the repository and the CI
# runner; Mattermost and BookStack are empty here and waiting on them only
# adds minutes. (`--core` is AlphaShop's flag and does not exist in this
# world: `wait-for-service` here takes [--all] [--quiet] [service...], and an
# unknown name exits 1, which fails every probe.)
#
# This also carries task setup, because the healthcheck is the only hook that
# runs as root before the agent starts. task-setup.sh is idempotent.
command = "WAIT_TIMEOUT=15 wait-for-service --quiet gitea && /usr/local/bin/task-setup.sh"
start_period_sec = 600.0
start_interval_sec = 10.0
interval_sec = 15.0
# 900, not 120. Harbor caps ONE probe at this, and the probe now carries the
# plant ingestion -- a Mattermost bulk import plus BookStack pages plus mail.
# At 120 the probe is killed mid-import, the next one starts over, and the trial
# dies having never finished a single pass.
timeout_sec = 900.0
retries = 20
