APP_NAME = SWEWorld Git
RUN_USER = gitea
RUN_MODE = prod
WORK_PATH = /var/lib/world/gitea

[server]
PROTOCOL = http
DOMAIN = git.@@DOMAIN@@
ROOT_URL = http://git.@@DOMAIN@@/
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3300
DISABLE_SSH = true
OFFLINE_MODE = true
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = /var/lib/world/gitea/gitea.db

[repository]
ROOT = /var/lib/world/gitea/repositories
DEFAULT_BRANCH = main

[security]
INSTALL_LOCK = true
; A closed world: the agent uses the API with the baked token.
SECRET_KEY = sweworld-not-a-secret
PASSWORD_HASH_ALGO = argon2

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
ENABLE_NOTIFY_MAIL = false

[actions]
; Gitea Actions is the only path code has into a running service.
ENABLED = true
DEFAULT_ACTIONS_URL = self

[cron]
ENABLED = false

[log]
MODE = console
LEVEL = info
ROOT_PATH = /var/lib/world/gitea/log

[indexer]
REPO_INDEXER_ENABLED = false
