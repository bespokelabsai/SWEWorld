## SWEWorld — maddy for a closed, offline world.
##
## Differs from stock in four ways, all deliberate:
##   1. no dmarc/dkim/spf/require_mx_record — they need public DNS, and in a
##      .local world each either rejects the message or stalls on a timeout
##   2. no outbound delivery — non-local recipients are rejected immediately
##      rather than queued forever against MX records that never resolve
##   3. no DKIM signing — nothing here is ever verified
##   4. insecure_auth on submission and IMAP, so ingestion and desktop clients
##      can log in over plaintext without trusting a self-signed cert

$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_DOMAIN}
$(local_domains) = $(primary_domain)

tls file /var/lib/world/maddy/tls/fullchain.pem /var/lib/world/maddy/tls/privkey.pem

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}

hostname $(hostname)

table.chain local_rewrites {
    optional_step regexp "(.+)\+(.+)@(.+)" "$1@$3"
    optional_step static {
        entry postmaster postmaster@$(primary_domain)
    }
    optional_step file /var/lib/world/maddy/aliases
}

msgpipeline local_routing {
    destination postmaster $(local_domains) {
        modify {
            replace_rcpt &local_rewrites
        }
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

smtp tcp://0.0.0.0:25 {
    limits {
        all rate 50 1s
        all concurrency 20
    }
    default_source {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.1.1 "Closed world: no outbound relay"
        }
    }
}

submission tcp://0.0.0.0:587 {
    limits {
        all rate 50 1s
    }
    insecure_auth yes
    auth &local_authdb
    source $(local_domains) {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.1.1 "Closed world: no outbound relay"
        }
    }
    default_source {
        reject 501 5.1.8 "Non-local sender domain"
    }
}

imap tcp://0.0.0.0:143 {
    insecure_auth yes
    auth &local_authdb
    storage &local_mailboxes
}
