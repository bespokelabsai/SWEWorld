# Vhost ingress for SWEWorld. One map, one server block — every service is
# reached at <name>.world.local on port 80. init-runtime.sh writes the matching
# 127.0.0.1 entries into /etc/hosts at boot so the names resolve inside the
# container too (the agent curls them, and so do the ingestion scripts).
map $host $backend_port {
    default                  3300;   # gitea
    git.world.local          3300;
    chat.world.local         8065;   # mattermost
    docs.world.local         8090;   # bookstack
    mail.world.local         8080;   # roundcube
    pass.world.local         8250;   # credentials page
    curator.world.local      9100;   # the agent-deployable service
}

server {
    listen 80 default_server;
    server_name *.world.local world.local;

    location / {
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }
}

# BookStack and Roundcube are PHP: nginx serves them directly through php-fpm
# rather than proxying to another HTTP server.
server {
    listen 8090;
    root /opt/bookstack/public;
    index index.php;
    client_max_body_size 200m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}

server {
    listen 8080;
    # Roundcube 1.7 serves from public_html, not the package root.
    root /opt/roundcube/public_html;
    index index.php;
    client_max_body_size 50m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ ^/(config|temp|logs)/ { deny all; }
}

server {
    listen 8250;
    root /opt/world/passstore;
    index index.html;
}
