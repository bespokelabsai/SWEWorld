; Boot one-shot: /etc/hosts vhost entries and any runtime fixups. Must complete
; before anything that resolves *.world.local. /etc/hosts cannot be written at
; image build time (docker bind-mounts it), so it is done here.
[program:init-runtime]
command=/usr/local/bin/init-runtime.sh
priority=1
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/var/log/supervisor/init-runtime.log
redirect_stderr=true
