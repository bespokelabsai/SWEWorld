; Priority 10 — datastores. Everything above waits on these.
; Two engines because each is the only one its service supports:
;   postgres -> mattermost (MySQL was removed from the MM codebase in v11)
;   mariadb  -> bookstack  (supports MySQL/MariaDB only, no sqlite/postgres)
; Gitea, Maddy and Roundcube use SQLite and need no server here.
[group:datastores]
programs=postgres,mariadb

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/world/postgres -c config_file=/var/lib/world/postgres/postgresql.conf
user=postgres
priority=10
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/postgres.log
redirect_stderr=true

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --datadir=/var/lib/world/mysql --socket=/run/mysqld/mysqld.sock --bind-address=127.0.0.1
user=root
priority=10
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/mariadb.log
redirect_stderr=true
