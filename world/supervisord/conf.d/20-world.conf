; Priority 20 — the world's own services (the four tools + ingress + CI).
[group:world]
programs=php-fpm,nginx,gitea,maddy,act-runner,deploy-daemon

[program:php-fpm]
; Shared by bookstack and roundcube; both are PHP, so one pool serves both.
command=/usr/sbin/php-fpm8.3 --nodaemonize --fpm-config /etc/php/8.3/fpm/php-fpm.conf
priority=19
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/php-fpm.log
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=22
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/nginx.log
redirect_stderr=true

[program:gitea]
command=/usr/local/bin/gitea web --config /etc/gitea/app.ini
directory=/var/lib/world/gitea
environment=GITEA_WORK_DIR="/var/lib/world/gitea",HOME="/var/lib/world/gitea"
user=gitea
priority=20
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/gitea.log
redirect_stderr=true

[program:maddy]
command=/usr/local/bin/maddy run --config /etc/maddy/maddy.conf
directory=/var/lib/world/maddy
environment=HOME="/var/lib/world/maddy"
user=worldsvc
priority=20
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/maddy.log
redirect_stderr=true

[program:act-runner]
; Host-exec mode: CI jobs run directly on this host as `deploy`. No Docker.
; Gated on Gitea being up — a slow Gitea boot would otherwise exhaust the
; start retries and leave the runner FATAL, which silently kills all CI.
command=/bin/bash -c 'until curl -sf --max-time 2 http://127.0.0.1:3300/api/v1/version >/dev/null; do sleep 2; done; exec /usr/local/bin/act_runner daemon --config /etc/act_runner/config.yaml'
directory=/var/lib/world/act-runner
environment=HOME="/var/lib/world/act-runner"
user=deploy
priority=25
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/act-runner.log
redirect_stderr=true

[program:deploy-daemon]
; Root: performs deploys submitted by the CI runner through the spool dir.
; gVisor ignores setuid, so sudo cannot elevate — this is the elevation path.
command=/usr/local/bin/deploy-daemon.sh
priority=21
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/deploy-daemon.log
redirect_stderr=true
