; Priority 30 — applications. Mattermost is part of the world; `app:*` programs
; below it are agent-deployable services, restarted by deploy-service.
[group:app]
programs=mattermost,curator

[program:mattermost]
command=/opt/mattermost/bin/mattermost
directory=/opt/mattermost
environment=MM_SERVICESETTINGS_SITEURL="http://chat.world.local",HOME="/var/lib/world/mattermost"
user=worldsvc
priority=30
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/mattermost.log
redirect_stderr=true

[program:curator]
; The agent-deployable service. `current` is a symlink flipped by
; deploy-service; a failed health check rolls it back to last-good.
command=/bin/bash -c 'exec /opt/sweworld/curator/current/run.sh'
directory=/opt/sweworld/curator/current
environment=HOME="/var/lib/sweworld/curator",PORT="9100"
user=svc
priority=35
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/curator.log
redirect_stderr=true
