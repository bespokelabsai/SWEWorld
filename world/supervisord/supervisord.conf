; SWEWorld — supervisord runs as PID 1 (root) and owns every service.
; The control socket is root-only (0700): the agent user (ubuntu) cannot run
; supervisorctl. The only sanctioned way code reaches a running service is
; Gitea CI -> request-deploy -> the root deploy-daemon.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=root:root

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
minfds=65536
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
